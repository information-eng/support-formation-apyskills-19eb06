ms: flex-start; text-align: left; padding: 30px 28px; border-radius: 20px; border: 2px solid {{ tpsBd.n4 }}; background: {{ tpsBg.n4 }}; color: {{ tpsFg.n4 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 44px; opacity: 0.6;\">5<\u002Fspan>\n        <span>Relier au projet<\u002Fspan>\n        <span style=\"font-family: var(--font-sans); font-size: 24px; font-weight: 500; opacity: 0.8;\">1 min<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div data-anim=\"fade\" style=\"background: var(--peri); border-radius: 20px; padding: 48px 56px; display: flex; flex-direction: column; flex: 1; min-height: 0;\">\n      <div style=\"display: {{ tpsShow.n0 }}; flex-direction: column; gap: 24px; flex: 1;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 42px; color: var(--violet); line-height: 1.3; max-width: 44ch;\">« Ce test explore … ; ce n’est pas un jugement ; vous êtes le seul à décider de ce que vous en gardez. »<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--ink-soft); max-width: 70ch;\">Une minute, pas plus — mais jamais zéro.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ tpsShow.n1 }}; flex-direction: column; gap: 24px; flex: 1;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 42px; color: var(--violet); line-height: 1.3; max-width: 44ch;\">« Avant que je vous montre : qu’est-ce que vous avez ressenti en répondant ? Qu’est-ce que vous attendez ? »<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--ink-soft); max-width: 70ch;\">Ce que la personne dit là vaut souvent plus que le résultat lui-même.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ tpsShow.n2 }}; flex-direction: column; gap: 24px; flex: 1;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 42px; color: var(--violet); line-height: 1.3; max-width: 44ch;\">La première lettre, le trait le plus marqué, le type dominant — puis les nuances : écarts faibles, paires équilibrées.<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--ink-soft); max-width: 70ch;\">On nomme ce que le test suggère, avec les mots de l’application.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ tpsShow.n3 }}; flex-direction: column; gap: 24px; flex: 1;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 42px; color: var(--violet); line-height: 1.3; max-width: 44ch;\">« Est-ce que vous vous y reconnaissez ? Où ça ne colle pas ? Vous avez un exemple vécu ? »<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--ink-soft); max-width: 70ch;\">Le désaccord est une information, et souvent la plus intéressante de la séance.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ tpsShow.n4 }}; flex-direction: column; gap: 24px; flex: 1;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 42px; color: var(--violet); line-height: 1.3; max-width: 44ch;\">« Qu’est-ce que ça change, ou confirme, pour la suite ? »<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--ink-soft); max-width: 70ch;\">On note au compte rendu une phrase — une seule — que le bénéficiaire valide.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Le désaccord\" data-screen-label=\"43\" data-speaker-notes=\"Quatrième temps. Si la personne n'est pas d'accord, ce n'est pas une erreur du test : c'est souvent l'information la plus intéressante de la séance.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;\">\n    <img src=\"d51d8c8c-4ccb-495c-835f-553614400324\" alt=\"\" style=\"position: absolute; right: 130px; bottom: 100px; width: 320px; transform: rotate(-8deg);\" data-anim=\"pop\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Quatrième temps · faire réagir<\u002Fp>\n    <blockquote data-anim=\"up\" style=\"animation-delay: 0.1s; margin: 40px 0 0; font-family: var(--font-display); font-size: 80px; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em; max-width: 22ch; color: var(--cream);\">Le désaccord est une information, pas une erreur du test.<\u002Fblockquote>\n    <p data-anim=\"up\" style=\"animation-delay: 0.2s; margin: 44px 0 0; font-size: var(--t-body); color: var(--peach); font-weight: 600; max-width: 34ch;\">« Est-ce que vous vous y reconnaissez ? Où ça ne colle pas ? Vous avez un exemple vécu ? »<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mise en pratique — le jeu de rôle\" data-screen-label=\"44\" data-speaker-notes=\"Mise en pratique d&#x27;Amandine, fusionnée avec le jeu de rôle du module : une consultante présente le résultat de son propre test Mes Talents Professionnels, et les autres lui posent des questions après analyse du résultat, en suivant la trame en cinq temps. Selon la taille du groupe : en binômes, ou une démonstration devant tout le groupe.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mise en pratique · Mes Talents Professionnels<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Une consultante présente, les autres l’interrogent<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 30px;\"><div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">1<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.2;\">Présenter<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Une consultante présente le résultat de son propre test Mes Talents Professionnels.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">2<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.2;\">Analyser, puis questionner<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Les autres lisent le résultat, puis lui posent leurs questions — en suivant la trame en cinq temps.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">3<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.2;\">Débriefer<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Qu’est-ce qui a ouvert l’échange ? Qu’est-ce qui l’a fermé ? Quelle question a fait avancer ?<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.4s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Lire entre deux pôles, et non comme une liste de qualités ou de défauts.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"§ 5 — Évaluation et clôture\" data-screen-label=\"45\" data-speaker-notes=\"Section : évaluation des acquis, satisfaction, émargement, suite.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Module 5 · 20 minutes<\u002Fp>\n    <p data-anim=\"fade\" style=\"margin: 16px 0 0; font-family: var(--font-display); font-size: 200px; line-height: 0.9; color: var(--peach); opacity: 0.4; font-weight: 700;\">5<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.12s; font-family: var(--font-display); font-size: 88px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em; margin: 48px 0 0; color: var(--cream); max-width: 18ch;\">Évaluation et clôture<\u002Fh2>\n  <\u002Fsection>\n\n  <section data-label=\"Évaluation et suite\" data-screen-label=\"46\" data-speaker-notes=\"Deux volets : le quizz de 30 questions (seuil 60 %) et le cas pratique observé sur 6 critères, 5 à observer. Puis émargement, certificat, case.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Ce qui vous attend<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 40px;\">Deux volets, puis la case<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 40px;\">\n      <div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--violet); border-radius: 20px; padding: 48px; display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--cream);\">Le quizz<\u002Fh3>\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 72px; font-weight: 700; color: var(--peach); line-height: 1;\">30 questions<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--peri);\">Réussi à partir de 60 % de bonnes réponses, soit 18 sur 30. Sous le seuil, on le refait à la maison sous 15 jours.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.22s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 48px; display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">Le cas pratique<\u002Fh3>\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 72px; font-weight: 700; color: var(--violet-mid); line-height: 1;\">6 critères<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft);\">Votre restitution en binôme, observée par la formatrice : cinq critères sur six doivent être présents.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"fade\" style=\"animation-delay: 0.3s; margin: 40px 0 0; display: flex; align-items: center; gap: 28px; background: var(--peri); border-radius: 14px; padding: 32px 40px;\">\n      <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); font-weight: 700;\">Émargement<\u002Fp>\n      <svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#5D5E96\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n      <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); font-weight: 700;\">Certificat de réalisation<\u002Fp>\n      <svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#5D5E96\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n      <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); font-weight: 700;\">Case « Tests ApySkills » cochée par le cabinet<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Quizz — 30 questions\" data-screen-label=\"47\" data-speaker-notes=\"Le quizz se fait sur son poste, une question à la fois. Correction à la fin, seuil 60 %.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) 64px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: center; flex: 1; min-height: 0;\">\n        <div>\n          <p style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Évaluation des acquis<\u002Fp>\n          <h2 style=\"font-family: var(--font-display); font-size: 80px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 28px 0 32px; max-width: 18ch;\">Le quizz : 30 questions à choix unique<\u002Fh2>\n          <p style=\"margin: 0 0 40px; font-size: var(--t-body); color: var(--ink-soft); max-width: 36ch;\">Une question à la fois, une seule bonne réponse. Vous pouvez revenir en arrière ; la correction s’affiche à la fin.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ start }}\" style=\"padding: 26px 52px; border-radius: 999px; border: none; background: var(--violet); color: var(--cream); font-family: var(--font-sans); font-size: 30px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(17,17,17,0.12); transition: transform 120ms cubic-bezier(0.22,1,0.36,1);\" style-active=\"transform: scale(0.98);\">Commencer le quizz<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border-radius: 20px; padding: 48px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; gap: 28px;\">\n          <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--slate);\">Règle de réussite<\u002Fp>\n          <p style=\"margin: 0; font-family: var(--font-display); font-size: 104px; font-weight: 700; color: var(--violet); line-height: 1;\">{{ seuilLabel }}<\u002Fp>\n          <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft);\">de bonnes réponses, soit {{ seuilCount }} questions sur 30.<\u002Fp>\n          <p style=\"margin: 0; font-size: var(--t-small); color: var(--slate);\">Le quizz couvre les cinq modules de la matinée : cadre, posture, les six outils, l’application, la restitution.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isQuestion }}\">\n      <div style=\"display: flex; flex-direction: column; flex: 1; min-height: 0;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 40px;\">\n          <p style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Question {{ qNum }} sur 30<\u002Fp>\n          <p style=\"margin: 0; font-size: var(--t-small); color: var(--slate);\">{{ answeredLabel }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"height: 10px; border-radius: 999px; background: var(--mist); margin: 24px 0 48px; overflow: hidden;\">\n          <div style=\"height: 100%; width: {{ progPct }}; background: var(--violet); border-radius: 999px; transition: width 420ms cubic-bezier(0.22,1,0.36,1);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <h2 style=\"font-family: var(--font-display); font-size: 48px; font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 44px; max-width: 42ch;\">{{ qText }}<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <sc-for list=\"{{ qOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display: flex; align-items: center; gap: 28px; text-align: left; width: 100%; box-sizing: border-box; padding: 26px 34px; border-radius: 999px; border: 2px solid {{ o.bd }}; background: {{ o.bg }}; color: {{ o.fg }}; font-family: var(--font-sans); font-size: 30px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n              <span style=\"flex: none; width: 54px; height: 54px; border-radius: 50%; background: {{ o.badgeBg }}; color: {{ o.badgeFg }}; font-family: var(--font-display); font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">{{ o.lettre }}<\u002Fspan>\n              <span>{{ o.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin: auto 0 0; display: flex; align-items: center; gap: 20px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" style=\"padding: 20px 40px; border-radius: 999px; border: 2px solid var(--border-strong); background: #fff; color: var(--graphite); font-family: var(--font-sans); font-size: 26px; font-weight: 600; cursor: pointer;\">Précédent<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 20px 40px; border-radius: 999px; border: none; background: var(--violet-mid); color: #fff; font-family: var(--font-sans); font-size: 26px; font-weight: 700; cursor: pointer;\">Suivant<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ finish }}\" style=\"margin-left: auto; padding: 20px 44px; border-radius: 999px; border: none; background: {{ finishBg }}; color: {{ finishFg }}; font-family: var(--font-sans); font-size: 26px; font-weight: 700; cursor: pointer;\">{{ finishLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isResult }}\">\n      <div style=\"display: grid; grid-template-columns: 0.9fr 1.3fr; gap: 64px; flex: 1; min-height: 0;\">\n        <div style=\"display: flex; flex-direction: column;\">\n          <p style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Résultat du quizz<\u002Fp>\n          <p style=\"margin: 28px 0 0; font-family: var(--font-display); font-size: 160px; font-weight: 700; line-height: 1; color: {{ resColor }};\">{{ scoreLabel }}<\u002Fp>\n          <p style=\"margin: 8px 0 0; font-size: 44px; font-family: var(--font-display); color: var(--ink-soft);\">{{ pctLabel }} de bonnes réponses<\u002Fp>\n          <p style=\"margin: 36px 0 0; font-size: var(--t-body); color: {{ resColor }}; font-weight: 700;\">{{ verdict }}<\u002Fp>\n          <p style=\"margin: 20px 0 0; font-size: var(--t-small); color: var(--ink-soft); max-width: 34ch;\">{{ verdictNote }}<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ restart }}\" style=\"margin: auto 0 0; align-self: flex-start; padding: 22px 44px; border-radius: 999px; border: 2px solid var(--violet); background: #fff; color: var(--violet); font-family: var(--font-sans); font-size: 26px; font-weight: 700; cursor: pointer;\">Recommencer<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border-radius: 20px; padding: 40px 44px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; gap: 20px; min-height: 0;\">\n          <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--slate);\">{{ reviewTitre }}<\u002Fp>\n          <div style=\"overflow: auto; display: flex; flex-direction: column; gap: 22px; padding-right: 12px;\">\n            <sc-for list=\"{{ review }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 22px;\">\n                <span style=\"flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">{{ r.n }}<\u002Fspan>\n                <span style=\"display: flex; flex-direction: column; gap: 8px;\">\n                  <span style=\"font-size: 26px; color: var(--ink); line-height: 1.35;\">{{ r.q }}<\u002Fspan>\n                  <span style=\"font-size: 24px; color: var(--error);\">{{ r.donnee }}<\u002Fspan>\n                  <span style=\"font-size: 24px; color: var(--viridian);\">{{ r.bonne }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section data-label=\"Clôture\" data-screen-label=\"48\" data-speaker-notes=\"Clôturer la séance (émargement) puis la session : les certificats sont délivrés. Les supports restent dans l'espace stagiaire.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;\">\n    <img src=\"0f2594a3-e67a-4798-be33-3452a693ce88\" alt=\"\" style=\"position: absolute; right: 140px; bottom: 120px; width: 340px; transform: rotate(6deg);\" data-anim=\"pop\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Ce que vous gardez<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.1s; font-family: var(--font-display); font-size: 80px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 32px 0 44px; color: var(--cream); max-width: 22ch;\">Dans votre espace stagiaire<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n      <p data-anim=\"up\" style=\"animation-delay: 0.16s; margin: 0; font-size: var(--t-body); color: var(--peri);\">Les six fiches de lecture des Tests ApySkills<\u002Fp>\n      <p data-anim=\"up\" style=\"animation-delay: 0.22s; margin: 0; font-size: var(--t-body); color: var(--peri);\">La trame de restitution<\u002Fp>\n      <p data-anim=\"up\" style=\"animation-delay: 0.28s; margin: 0; font-size: var(--t-body); color: var(--peri);\">L’aide-mémoire déontologie<\u002Fp>\n      <p data-anim=\"up\" style=\"animation-delay: 0.34s; margin: 0; font-size: var(--t-body); color: var(--peri);\">Les neuf vidéos de préparation<\u002Fp>\n    <\u002Fdiv>\n    <img src=\"da950d46-b845-438b-a4d2-acef5a235b53\" alt=\"Arbre de Vie\" style=\"position: absolute; left: var(--pad-x); bottom: 56px; height: 48px;\">\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;seuilPct&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:60,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:50,&quot;max&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Quizz&quot;},&quot;afficherCorrige&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Quizz&quot;}}\">\nconst VIOLET = '#5D5E96';\nconst VIOLET_MID = '#8081BD';\nconst PERI = '#DAE0F3';\nconst CREAM = '#F7F4EC';\nconst WHITE = '#FFFFFF';\nconst MIST = '#E6E6E6';\n\nconst RIASEC = {\n  R: { titre: 'R · Réaliste', texte: 'Le concret, fabriquer, le terrain. Agir sur des choses plutôt que sur des idées ou des personnes.', voisins: 'Voisins sur l’hexagone : Investigateur et Conventionnel. Opposé : Social.' },\n  I: { titre: 'I · Investigateur', texte: 'Comprendre, analyser, résoudre. Chercher pourquoi, avant de chercher comment faire accepter.', voisins: 'Voisins : Réaliste et Artistique. Opposé : Entreprenant.' },\n  A: { titre: 'A · Artistique', texte: 'Créer, s’exprimer, donner une forme personnelle à ce qu’on fait.', voisins: 'Voisins : Investigateur et Social. Opposé : Conventionnel.' },\n  S: { titre: 'S · Social', texte: 'Aider, transmettre, accompagner. L’attention est tournée vers les personnes.', voisins: 'Voisins : Artistique et Entreprenant. Opposé : Réaliste.' },\n  E: { titre: 'E · Entreprenant', texte: 'Convaincre, décider, entraîner. Prendre l’initiative et embarquer les autres.', voisins: 'Voisins : Social et Conventionnel. Opposé : Investigateur.' },\n  C: { titre: 'C · Conventionnel', texte: 'L’ordre, la méthode, la fiabilité. Faire tourner ce qui doit tourner, sans approximation.', voisins: 'Voisins : Entreprenant et Réaliste. Opposé : Artistique.' }\n};\n\nconst TRAITS = [\n  { key: 'O', nom: 'Ouverture', score: 42, haut: 'Curiosité, goût des idées nouvelles, envie d’explorer.', bas: 'Préférence pour le concret et l’éprouvé — pas un manque de curiosité.', note: 'On commente d’abord les traits les plus marqués, très hauts ou très bas.' },\n  { key: 'C', nom: 'Conscience', score: 38, haut: 'Organisation, persévérance, goût du travail fini.', bas: 'Souplesse, capacité à improviser et à changer de cap.', note: 'Un score se lit comme un curseur, jamais comme une case.' },\n  { key: 'E', nom: 'Extraversion', score: 21, haut: 'Énergie tournée vers les autres, à l’aise dans le groupe.', bas: 'Énergie qui se recharge dans le calme, écoute, travail en profondeur.', note: 'Un score bas n’empêche rien : ce sont des conditions, pas des capacités.' },\n  { key: 'A', nom: 'Agréabilité', score: 44, haut: 'Coopération, empathie, recherche de l’accord.', bas: 'Franchise, esprit critique, capacité à dire non.', note: 'À relier aux conditions de travail plutôt qu’à un métier.' },\n  { key: 'N', nom: 'Névrosisme', score: 17, haut: 'Sensibilité au stress et aux émotions : une tendance, pas un état.', bas: 'Stabilité émotionnelle, réactions posées sous pression.', note: 'On le présente comme une sensibilité émotionnelle. Jamais une pathologie.' }\n];\n\nconst PAIRES = [\n  { sujet: 'D’où vient l’énergie', g: 'E', d: 'I' },\n  { sujet: 'Comment on prend l’information', g: 'S', d: 'N' },\n  { sujet: 'Comment on décide', g: 'T', d: 'F' },\n  { sujet: 'Comment on s’organise', g: 'J', d: 'P' }\n];\n\nconst SCORES_PAIRES = {\n  net: [[23, 9], [11, 21], [13, 19], [10, 22]],\n  equ: [[16, 15], [14, 17], [15, 16], [13, 19]]\n};\n\nconst ENN = [\n  { n: 1, nom: 'Le perfectionniste', force: 'Exigeant, droit, fiable : il élève le niveau autour de lui.', defi: 'Accepter l’imparfait, chez lui comme chez les autres.' },\n  { n: 2, nom: 'L’altruiste', force: 'Généreux, attentif aux autres, présent quand il faut.', defi: 'Reconnaître ses propres besoins et les formuler.' },\n  { n: 3, nom: 'Le battant', force: 'Efficace, orienté résultat, sait se rendre visible.', defi: 'Exister en dehors de la performance.' },\n  { n: 4, nom: 'Le créatif sensible', force: 'Authentique, expressif, attentif aux nuances.', defi: 'Ne pas se mesurer en permanence aux autres.' },\n  { n: 5, nom: 'L’observateur', force: 'Lucide, indépendant, sait prendre du recul.', defi: 'Passer à l’action avec les autres, sans tout maîtriser d’abord.' },\n  { n: 6, nom: 'Le loyal prudent', force: 'Fiable, anticipe les risques, tient ses engagements.', defi: 'Faire confiance, à soi et aux autres.' },\n  { n: 7, nom: 'L’épicurien', force: 'Enthousiaste, plein d’idées, remet de l’air dans les impasses.', defi: 'Aller au bout de ce qui a été commencé.' },\n  { n: 8, nom: 'Le meneur', force: 'Décidé, protecteur, prend les sujets de front.', defi: 'Laisser de la place aux autres.' },\n  { n: 9, nom: 'Le médiateur', force: 'Apaisant, conciliant, sait tenir un collectif ensemble.', defi: 'Dire ce qu’il veut, et le tenir.' }\n];\n\nconst ENN_POS = [\n  { n: 1, x: '77%', y: '17.8%' }, { n: 2, x: '91.4%', y: '42.7%' }, { n: 3, x: '86.4%', y: '71%' },\n  { n: 4, x: '64.4%', y: '89.5%' }, { n: 5, x: '35.6%', y: '89.5%' }, { n: 6, x: '13.6%', y: '71%' },\n  { n: 7, x: '8.6%', y: '42.7%' }, { n: 8, x: '23%', y: '17.8%' }, { n: 9, x: '50%', y: '8%' }\n];\n\nconst QUESTIONS = [\n  { q: 'Pourquoi la case « Tests ApySkills » existe-t-elle dans la fiche consultante ?', o: ['Qualiopi demande que la personne qui fait passer un test soit formée à l’usage de ce test', 'C’est une option commerciale du cabinet', 'Elle limite le nombre de tests envoyés chaque mois'], a: 0 },\n  { q: 'Tant que la case n’est pas cochée, dans la fenêtre « Confier » :', o: ['les tests s’envoient, mais sans résultats', 'les tests n’apparaissent pas : seuls les questionnaires sont proposés', 'les tests sont proposés avec un avertissement'], a: 1 },\n  { q: 'Qui coche la case « Tests ApySkills » ?', o: ['la consultante elle-même, dans son profil', 'le cabinet, sur présentation du certificat de réalisation', 'l’organisme certificateur Qualiopi'], a: 1 },\n    { q: 'L’application propose 10 tests. Ils correspondent à :', o: ['10 outils différents, un par test', '6 outils, dont 4 existent en version adultes et en version Collège & Lycée', '4 outils, en version adultes uniquement'], a: 1 },\n  { q: 'Le terme à employer pour parler de ces tests est :', o: ['test psychotechnique', 'Test ApySkills', 'test de personnalité'], a: 1 },\n  { q: 'Les questionnaires du bilan (grille préalable, positionnement, satisfaction) :', o: ['sont des Tests ApySkills soumis à la case', 'ne sont pas des Tests ApySkills et ne sont jamais bloqués par la case', 'remplacent les tests pour les jeunes'], a: 1 },\n  { q: 'Un test est d’abord :', o: ['un support d’échange : il ouvre une conversation, et le résultat appartient au bénéficiaire', 'un verdict qui tranche une hésitation de projet', 'un outil de sélection entre plusieurs candidats'], a: 0 },\n  { q: 'Avant de confier un test, la question à se poser est :', o: ['« combien de tests ai-je déjà confiés ce mois-ci ? »', '« qu’est-ce que je cherche à éclairer dans ce projet ? »', '« lequel prend le moins de temps ? »'], a: 1 },\n  { q: 'Le consentement explicite porte sur :', o: ['la seule durée de passation', 'ce que le test explore, le temps qu’il prend, qui verra les résultats, et la possibilité de refuser', 'l’autorisation du financeur'], a: 1 },\n  { q: 'Ce qu’un test ne dit pas :', o: ['il ne dit pas si quelqu’un est « bon » ou « mauvais » et ne prédit pas la réussite dans un métier', 'il ne donne aucune indication exploitable', 'il ne se lit pas sans un psychologue'], a: 0 },\n  { q: 'En restitution, quelle formule employer ?', o: ['« votre type, c’est… »', '« le test suggère… ; est-ce que vous vous y reconnaissez ? »', '« ça confirme que vous n’êtes pas fait pour ça »'], a: 1 },\n  { q: 'Un employeur qui finance un bilan demande les résultats détaillés des Tests ApySkills :', o: ['on les envoie : c’est lui qui paie', 'on refuse : les résultats détaillés sont réservés au bénéficiaire', 'on envoie seulement Ma Boussole'], a: 1 },\n  { q: 'La preuve qu’un test a été passé se trouve :', o: ['dans le journal Qualiopi du dossier et le dossier de preuves, automatiquement', 'dans un tableur tenu à côté de l’application', 'dans la boîte mail de la consultante'], a: 0 },\n  { q: 'Le résultat d’un test Ma Boussole est :', o: ['un score sur 100', 'un code de 3 lettres : les 3 intérêts les plus forts', 'un métier conseillé'], a: 1 },\n  { q: 'Ma Boussole explore :', o: ['ce que la personne sait faire', 'sa personnalité', 'ce que la personne aime faire'], a: 2 },\n  { q: 'Ma Boussole, c’est :', o: ['48 questions, 8 par type, 6 types d’intérêts', '60 questions, 10 par type', '45 questions, 5 par type'], a: 0 },\n  { q: 'Un profil Ma Boussole « 31 · 30 · 29 » se lit comme :', o: ['une dominante nette sur la première lettre', 'un profil plat : rien n’est tranché, c’est en entretien qu’on creuse', 'un test à refaire'], a: 1 },\n  { q: 'Deux types opposés sur l’hexagone (Réaliste et Social, par exemple) signalent :', o: ['une erreur de passation', 'une personne aux facettes contrastées : matière à discussion', 'un profil inexploitable'], a: 1 },\n  { q: 'Le résultat de Mes 5 Facettes est :', o: ['un profil : 5 scores, sans code', 'un code de 5 lettres', 'un type dominant et son aile'], a: 0 },\n  { q: 'Dans Mes 5 Facettes, un score bas en Ouverture signifie :', o: ['une préférence pour le concret et l’éprouvé', 'un manque de curiosité à corriger', 'une difficulté d’apprentissage'], a: 0 },\n  { q: 'Le mot « Névrosisme » se présente au bénéficiaire comme :', o: ['une fragilité', 'une sensibilité au stress et aux émotions : une tendance, pas un état', 'on ne le présente pas au bénéficiaire'], a: 1 },\n  { q: 'Les questions inversées de Mes 5 Facettes (« je me tiens en retrait ») :', o: ['doivent être recalculées à la main par la consultante', 'sont prises en compte par l’application : à savoir pour ne pas s’étonner des réponses brutes', 'invalident le trait concerné'], a: 1 },\n  { q: 'Quand confier Mes 5 Facettes ?', o: ['pour désigner un métier cible', 'pour travailler les conditions de travail qui conviennent : rythme, autonomie, relation', 'pour mesurer un potentiel d’évolution'], a: 1 },\n  { q: 'Les quatre paires de Mon Mode d’Emploi sont :', o: ['E/I, S/N, T/F, J/P', 'R/I, A/S, E/C, T/F', 'O, C, E, A, N'], a: 0 },\n  { q: 'Un score de 16 contre 15 sur la paire E/I veut dire :', o: ['le test a échoué', 'il faut refaire passer le test', 'la personne est à l’aise des deux côtés, et on le dit tel quel'], a: 2 },\n  { q: 'Mon Mode d’Emploi et Mon ADN sont présentés dans l’application comme :', o: ['des tests scientifiquement validés', 'des supports d’échange, pas des évaluations validées', 'des tests réservés aux jeunes'], a: 1 },\n  { q: 'Un résultat « Type 7 aile 8 » signifie :', o: ['le type dominant est le 7 et, de ses deux voisins sur le cercle, le 8 est le plus fort', 'la personne est entre deux types, au hasard', 'le 8 est son type au travail, le 7 son type à la maison'], a: 0 },\n  { q: 'On lit un type de Mon ADN :', o: ['en annonçant le défi d’abord, pour faire progresser', 'la force d’abord, le défi proposé comme une piste, jamais comme un reproche', 'en le comparant au type de la consultante'], a: 1 },\n  { q: 'Pour une élève de 1re, on confie :', o: ['la version adultes, elle est plus complète', 'les deux versions, pour comparer', 'la version collège & lycée : même instrument, phrases adaptées'], a: 2 },\n  { q: 'Dans la trame de restitution, le deuxième temps consiste à :', o: ['montrer tout de suite le résultat le plus marqué', 'demander le ressenti du bénéficiaire avant de montrer le résultat', 'relier au projet et noter une phrase validée'], a: 1 }\n];\n\nconst LETTRES = ['a', 'b', 'c', 'd'];\n\nclass Component extends DCLogic {\n  state = {\n    caseOn: false,\n    rep: 0,\n    flips: {},\n    sits: {},\n    hex: 'S',\n    trait: 'N',\n    pair: 'net',\n    enn: 7,\n    etape: 0,\n    temps: 0,\n    phase: 'intro',\n    qi: 0,\n    answers: {}\n  };\n\n  renderVals() {\n    const s = this.state;\n    const seuil = Number(this.props.seuilPct ?? 60);\n    const seuilCount = Math.ceil((seuil / 100) * QUESTIONS.length);\n\n    // --- Module 0 : la case\n    const caseVals = {\n      toggleCase: () => this.setState({ caseOn: !s.caseOn }),\n      caseBg: s.caseOn ? VIOLET : WHITE,\n      caseBd: s.caseOn ? VIOLET : '#C7C7C7',\n      caseTick: s.caseOn ? CREAM : 'transparent',\n      caseOpa: s.caseOn ? 1 : 0.12,\n      caseHint: s.caseOn\n        ? 'Case cochée : les 10 tests apparaissent, soit six outils en version adultes et collège & lycée.'\n        : 'Cliquez la case : sans elle, seuls les questionnaires du bilan sont proposés.'\n    };\n\n    const picks = {};\n\n    // --- Module 1 : repères (texte dans le template, styles ici)\n    const repBg = {}, repFg = {}, repBd = {}, repShow = {};\n    for (let i = 0; i < 6; i++) {\n      const on = i === s.rep;\n      repBg['n' + i] = on ? VIOLET : WHITE;\n      repFg['n' + i] = on ? CREAM : VIOLET;\n      repBd['n' + i] = on ? VIOLET : MIST;\n      repShow['n' + i] = on ? 'flex' : 'none';\n      picks['pickRep' + i] = () => this.setState({ rep: i });\n    }\n\n    // --- Module 1 : les mots (recto/verso dans le template)\n    const motBg = {}, motFg = {}, motFront = {}, motBack = {};\n    for (let i = 0; i < 4; i++) {\n      const on = !!s.flips[i];\n      motBg['n' + i] = on ? VIOLET : WHITE;\n      motFg['n' + i] = on ? CREAM : VIOLET;\n      motFront['n' + i] = on ? 'none' : 'flex';\n      motBack['n' + i] = on ? 'flex' : 'none';\n      picks['flipMot' + i] = () => this.setState({ flips: Object.assign({}, this.state.flips, { [i]: !this.state.flips[i] }) });\n    }\n\n    // --- Module 1 : situations (énoncés et options dans le template)\n    const SIT_OK = { A: 1, B: 1, C: 2 };\n    const sitMaps = {};\n    ['A', 'B', 'C'].forEach((key) => {\n      const given = s.sits[key];\n      const answered = given !== undefined;\n      const m = { fb: answered ? 'block' : 'none' };\n      for (let i = 0; i < 3; i++) {\n        let bg = WHITE, fg = '#2E2E2E', bd = MIST;\n        if (answered) {\n          if (i === SIT_OK[key]) { bg = '#DFEABB'; fg = '#00563F'; bd = '#007052'; }\n          else if (i === given) { bg = '#FBE9E7'; fg = '#8E2A1E'; bd = '#C0392B'; }\n          else { fg = '#9A9A9A'; }\n        }\n        m['g' + i] = bg; m['f' + i] = fg; m['b' + i] = bd;\n        picks['sit' + key + i] = () => this.setState({ sits: Object.assign({}, this.state.sits, { [key]: i }) });\n      }\n      sitMaps[key] = m;\n    });\n\n    // --- Module 2 : Ma Boussole\n    const hexBg = {}, hexFg = {};\n    Object.keys(RIASEC).forEach((k) => {\n      hexBg[k] = k === s.hex ? VIOLET : WHITE;\n      hexFg[k] = k === s.hex ? CREAM : VIOLET;\n    });\n    const hx = RIASEC[s.hex];\n\n    // --- Module 2 : Mes 5 Facettes\n    const traits = TRAITS.map((t) => {\n      const on = t.key === s.trait;\n      return {\n        nom: t.nom,\n        score: String(t.score),\n        pct: Math.round(((t.score - 10) / 40) * 100) + '%',\n        fill: on ? VIOLET : VIOLET_MID,\n        bg: on ? PERI : WHITE,\n        bd: on ? VIOLET : MIST,\n        pick: () => this.setState({ trait: t.key })\n      };\n    });\n    const tr = TRAITS.find((t) => t.key === s.trait) || TRAITS[0];\n\n    // --- Module 2 : Mon Mode d’Emploi\n    const sc = SCORES_PAIRES[s.pair];\n    const paires = PAIRES.map((p, i) => {\n      const [gs, ds] = sc[i];\n      const max = 26;\n      return {\n        sujet: p.sujet, g: p.g, d: p.d,\n        gs: String(gs), ds: String(ds),\n        gw: Math.round((gs / max) * 100) + '%',\n        dw: Math.round((ds / max) * 100) + '%',\n        gc: gs >= ds ? VIOLET : PERI,\n        dc: ds > gs ? VIOLET : PERI\n      };\n    });\n    const pairCode = PAIRES.map((p, i) => (sc[i][0] >= sc[i][1] ? p.g : p.d)).join('');\n    const netOn = s.pair === 'net';\n\n    // --- Module 2 : Mon ADN\n    const wings = [((s.enn + 7) % 9) + 1, (s.enn % 9) + 1];\n    const ennNodes = ENN_POS.map((p) => {\n      const sel = p.n === s.enn;\n      const wing = wings.indexOf(p.n) >= 0;\n      return {\n        n: String(p.n), x: p.x, y: p.y,\n        bg: sel ? VIOLET : (wing ? PERI : WHITE),\n        fg: sel ? CREAM : VIOLET,\n        pick: () => this.setState({ enn: p.n })\n      };\n    });\n    const et = ENN.find((e) => e.n === s.enn) || ENN[0];\n\n    // --- Module 3 : le circuit (texte dans le template)\n    const etpBg = {}, etpFg = {}, etpBd = {}, etpShow = {};\n    for (let i = 0; i < 6; i++) {\n      const on = i === s.etape;\n      etpBg['n' + i] = on ? VIOLET : WHITE;\n      etpFg['n' + i] = on ? CREAM : '#2E2E2E';\n      etpBd['n' + i] = on ? VIOLET : PERI;\n      etpShow['n' + i] = on ? 'flex' : 'none';\n      picks['pickEtp' + i] = () => this.setState({ etape: i });\n    }\n\n    // --- Module 4 : la trame (texte dans le template)\n    const tpsBg = {}, tpsFg = {}, tpsBd = {}, tpsShow = {};\n    for (let i = 0; i < 5; i++) {\n      const on = i === s.temps;\n      tpsBg['n' + i] = on ? VIOLET : WHITE;\n      tpsFg['n' + i] = on ? CREAM : VIOLET;\n      tpsBd['n' + i] = on ? VIOLET : MIST;\n      tpsShow['n' + i] = on ? 'flex' : 'none';\n      picks['pickTps' + i] = () => this.setState({ temps: i });\n    }\n\n    // --- Quizz\n    const total = QUESTIONS.length;\n    const q = QUESTIONS[s.qi];\n    const answeredCount = Object.keys(s.answers).length;\n    const complete = answeredCount === total;\n    const score = QUESTIONS.reduce((n, item, i) => n + (s.answers[i] === item.a ? 1 : 0), 0);\n    const pct = Math.round((score / total) * 100);\n    const pass = pct >= seuil;\n    const showCorrige = this.props.afficherCorrige ?? true;\n    const missed = QUESTIONS.map((item, i) => ({ item, i }))\n      .filter(({ item, i }) => s.answers[i] !== item.a)\n      .map(({ item, i }) => ({\n        n: String(i + 1),\n        q: item.q,\n        donnee: s.answers[i] === undefined ? 'Sans réponse' : 'Votre réponse : ' + item.o[s.answers[i]],\n        bonne: showCorrige ? 'Bonne réponse : ' + item.o[item.a] : 'À revoir avec la formatrice'\n      }));\n\n    return Object.assign({}, caseVals, picks, {\n      repBg, repFg, repBd, repShow,\n      motBg, motFg, motFront, motBack,\n      sitA: sitMaps.A, sitB: sitMaps.B, sitC: sitMaps.C,\n      hexBg, hexFg,\n      pickR: () => this.setState({ hex: 'R' }), pickI: () => this.setState({ hex: 'I' }),\n      pickA: () => this.setState({ hex: 'A' }), pickS: () => this.setState({ hex: 'S' }),\n      pickE: () => this.setState({ hex: 'E' }), pickC: () => this.setState({ hex: 'C' }),\n      hexTitre: hx.titre, hexTexte: hx.texte, hexVoisins: hx.voisins, hexCode: 'SEA',\n      traits, traitNom: tr.nom, traitHaut: tr.haut, traitBas: tr.bas, traitNote: tr.note,\n      paires, pairCode,\n      pairLecture: netOn\n        ? 'Chaque paire est tranchée : 23 contre 9 sur E/I, la préférence est claire. On nomme la lettre sans hésiter.'\n        : 'Mêmes quatre lettres, lecture très différente : 16 contre 15, la personne est à l’aise des deux côtés — on le dit tel quel, sans forcer une lettre.',\n      setNet: () => this.setState({ pair: 'net' }), setEqu: () => this.setState({ pair: 'equ' }),\n      netBg: netOn ? VIOLET : WHITE, netFg: netOn ? CREAM : VIOLET, netBd: netOn ? VIOLET : MIST,\n      equBg: netOn ? WHITE : VIOLET, equFg: netOn ? VIOLET : CREAM, equBd: netOn ? MIST : VIOLET,\n      ennNodes, ennTitre: 'Type ' + et.n + ' · ' + et.nom, ennForce: et.force, ennDefi: et.defi,\n      ennAiles: 'Ailes possibles : ' + wings[0] + ' ou ' + wings[1] + ' — l’aile est celle des deux dont le score est le plus fort.',\n      ennResultat: 'Type ' + s.enn + ' aile ' + wings[1],\n      etpBg, etpFg, etpBd, etpShow,\n      tpsBg, tpsFg, tpsBd, tpsShow,\n      isIntro: s.phase === 'intro', isQuestion: s.phase === 'quiz', isResult: s.phase === 'result',\n      seuilLabel: seuil + ' %', seuilCount: String(seuilCount),\n      start: () => { if (this._advance) { clearTimeout(this._advance); this._advance = null; } this.setState({ phase: 'quiz', qi: 0, answers: {} }); },\n      qNum: String(s.qi + 1), qText: q.q,\n      progPct: Math.round(((s.qi + 1) / total) * 100) + '%',\n      answeredLabel: answeredCount + ' réponse' + (answeredCount > 1 ? 's' : '') + ' sur ' + total,\n      qOpts: q.o.map((label, i) => {\n        const on = s.answers[s.qi] === i;\n        return {\n          label, lettre: LETTRES[i],\n          bg: on ? PERI : WHITE, fg: on ? VIOLET : '#2E2E2E', bd: on ? VIOLET : MIST,\n          badgeBg: on ? VIOLET : MIST, badgeFg: on ? CREAM : '#6B6B6B',\n          pick: () => {\n            if (this._advance) { clearTimeout(this._advance); this._advance = null; }\n            this.setState((st) => ({ answers: Object.assign({}, st.answers, { [st.qi]: i }) }));\n            this._advance = setTimeout(() => {\n              this._advance = null;\n              this.setState((st) => {\n                if (Object.keys(st.answers).length >= total) return null;\n                let n = st.qi;\n                for (let k = 1; k <= total; k++) {\n                  const c = (st.qi + k) % total;\n                  if (st.answers[c] === undefined) { n = c; break; }\n                }\n                return { qi: n };\n              });\n            }, 280);\n          }\n        };\n      }),\n      prev: () => this.setState({ qi: Math.max(0, s.qi - 1) }),\n      next: () => this.setState({ qi: Math.min(total - 1, s.qi + 1) }),\n      finish: () => { if (complete) this.setState({ phase: 'result' }); },\n      finishLabel: complete ? 'Voir mon résultat' : 'Il reste ' + (total - answeredCount) + ' question' + (total - answeredCount > 1 ? 's' : ''),\n      finishBg: complete ? VIOLET : MIST,\n      finishFg: complete ? CREAM : '#6B6B6B',\n      scoreLabel: score + ' / ' + total, pctLabel: pct + ' %',\n      resColor: pass ? '#007052' : '#C0392B',\n      verdict: pass ? 'Quizz réussi' : 'Seuil non atteint',\n      verdictNote: pass\n        ? 'Le seuil de ' + seuil + ' % est atteint. Reste le cas pratique : votre restitution en binôme, observée sur six critères.'\n        : 'Le seuil est de ' + seuil + ' %, soit ' + seuilCount + ' bonnes réponses sur ' + total + '. La formatrice vous confie le quizz à refaire à la maison sous quinze jours.',\n      reviewTitre: missed.length === 0 ? 'Aucune erreur' : missed.length + ' question' + (missed.length > 1 ? 's' : '') + ' à revoir',\n      review: missed,\n      restart: () => { if (this._advance) { clearTimeout(this._advance); this._advance = null; } this.setState({ phase: 'intro', qi: 0, answers: {} }); }\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
