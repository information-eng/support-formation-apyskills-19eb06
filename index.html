document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"aed76195-e10e-4323-90d8-c70944280005\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================\n   ARBRE DE VIE — Foundations\n   Skills assessments & academic guidance counseling\n   \"Orientation & Bien-être\"\n   ============================================================ */\n\n/* No Google Fonts import — both display + sans are local brand files. */\n\n/* Brand display — Noto Serif KR (uploaded by client) */\n\n\n\n\n\n\n\n\n\n/* Brand sans — Noto Sans KR (uploaded by client)\n   Variable font, weight axis 100 → 900 in a single file. */\n\n\n:root {\n  /* ---------- BRAND PALETTE (RVB, sampled from official logos) ----------\n     The system is built on warm pastels + grounded jewel tones.\n     Pastels are used as backgrounds, jewel tones for ink and accents. */\n\n  /* Pastels (use as backgrounds, soft surfaces) */\n  --peach:           #FFF5A9;   /* warm butter-yellow, the signature surface */\n  --periwinkle:      #DAE0F3;   /* cool lavender mist */\n  --tea-green:       #DFEABB;   /* soft sage */\n  --uranian-blue:    #B5DEF8;   /* pale sky */\n\n  /* Jewel tones (use as type, accents, primary CTAs) */\n  --tropical-indigo: #8081BD;   /* dusty violet */\n  --ucla-blue:       #056391;   /* deep teal-blue, primary brand color */\n  --viridian:        #007052;   /* forest emerald */\n  --pumpkin:         #F38F30;   /* secondary accent only */\n\n  /* Neutrals */\n  --black:           #111111;\n  --ink:             #1A1A1A;\n  --ink-soft:        #2E2E2E;\n  --graphite:        #4A4A4A;\n  --slate:           #6B6B6B;\n  --stone:           #9A9A9A;\n  --pebble:          #C7C7C7;\n  --mist:            #E6E6E6;\n  --cream:           #F7F4EC;   /* warm off-white default page background */\n  --white:           #FFFFFF;\n\n  /* ---------- SEMANTIC TOKENS ---------- */\n  --bg:              var(--cream);\n  --bg-alt:          var(--peach);\n  --bg-card:         var(--white);\n  --bg-inverse:      var(--ucla-blue);\n\n  --fg-1:            var(--ink);          /* primary body */\n  --fg-2:            var(--graphite);     /* secondary body */\n  --fg-3:            var(--slate);        /* tertiary / captions */\n  --fg-muted:        var(--stone);        /* hints, placeholders */\n  --fg-on-dark:      var(--cream);\n  --fg-on-pastel:    var(--ucla-blue);    /* type on peach/peri/tea-green */\n\n  --border:          var(--mist);\n  --border-strong:   var(--pebble);\n  --border-ink:      var(--ink);\n\n  --accent:          var(--ucla-blue);\n  --accent-warm:     var(--pumpkin);\n  --accent-soft:     var(--periwinkle);\n  --accent-leaf:     var(--viridian);\n\n  --success:         var(--viridian);\n  --info:            var(--ucla-blue);\n  --warning:         var(--pumpkin);\n  --error:           #C0392B;\n\n  /* ---------- MÉTIER COLOR MAPPING ----------\n     Each line of business has its own dedicated brand color.\n     Use these tokens when designing for a specific métier;\n     they cascade through buttons, eyebrows, accents, and headers. */\n\n  /* Orientation scolaire — students / academic guidance → ORANGES */\n  --metier-scolaire:        var(--pumpkin);          /* #F38F30 */\n  --metier-scolaire-soft:   var(--peach);            /* warm-side pastel pairing */\n  --metier-scolaire-ink:    #B85F0E;                 /* darkened pumpkin for text on light */\n\n  /* Orientation professionnelle — adults / career → VERTS */\n  --metier-pro:             var(--viridian);         /* #007052 */\n  --metier-pro-soft:        var(--tea-green);\n  --metier-pro-ink:         var(--viridian);\n\n  /* Missions RH — HR decision-makers → BLEUS */\n  --metier-rh:              var(--ucla-blue);        /* #056391 */\n  --metier-rh-soft:         var(--uranian-blue);\n  --metier-rh-ink:          var(--ucla-blue);\n\n  /* Formation — training → VIOLETS */\n  --metier-formation:       var(--tropical-indigo);  /* #8081BD */\n  --metier-formation-soft:  var(--periwinkle);\n  --metier-formation-ink:   #5D5E96;                 /* darkened indigo for text on light */\n\n  /* ---------- TYPOGRAPHY ----------\n     Display:  Noto Serif KR (official brand serif — files supplied by client,\n               8-weight family from ExtraLight 200 → Black 900).\n               NOTE: Noto Serif KR has no italic; the wordmark's cursive italic V is\n               a custom glyph treatment. For italic accents, fall back to a\n               complementary serif italic.\n     Body:     Noto Sans KR (official brand sans — files supplied by client,\n               full 9-weight family from Thin 100 → Black 900). */\n\n  --font-display: 'Noto Serif KR', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;\n  --font-display-italic: 'Cormorant Garamond', Georgia, serif;  /* italic-only fallback */\n  --font-sans:    'Noto Sans KR', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --font-mono:    'JetBrains Mono', 'SF Mono', ui-monospace, monospace;\n\n  /* Type scale — tuned for editorial warmth, generous line-height */\n  --fs-display:  clamp(48px, 7.5vw, 96px);\n  --fs-h1:       clamp(36px, 5vw, 64px);\n  --fs-h2:       clamp(28px, 3.5vw, 44px);\n  --fs-h3:       24px;\n  --fs-h4:       20px;\n  --fs-eyebrow:  13px;        /* uppercase mini-label */\n  --fs-body-lg:  19px;\n  --fs-body:     16px;\n  --fs-body-sm:  14px;\n  --fs-caption:  12px;\n\n  --lh-tight:   1.1;\n  --lh-snug:    1.25;\n  --lh-normal:  1.55;\n  --lh-loose:   1.75;\n\n  --tracking-tight:   -0.02em;\n  --tracking-normal:  0;\n  --tracking-wide:    0.04em;\n  --tracking-eyebrow: 0.18em;  /* the \"ORIENTATION & BIEN-ÊTRE\" treatment */\n\n  /* ---------- SPACING (8pt grid w/ 4pt halves) ---------- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* ---------- RADII ---------- */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   14px;   /* default cards */\n  --radius-lg:   20px;\n  --radius-xl:   28px;\n  --radius-pill: 999px;  /* signature buttons + chips */\n\n  /* ---------- ELEVATION ---------- */\n  --shadow-xs: 0 1px 2px rgba(17, 17, 17, 0.04);\n  --shadow-sm: 0 2px 6px rgba(17, 17, 17, 0.06), 0 1px 2px rgba(17, 17, 17, 0.04);\n  --shadow-md: 0 8px 24px rgba(17, 17, 17, 0.08), 0 2px 6px rgba(17, 17, 17, 0.04);\n  --shadow-lg: 0 24px 48px rgba(17, 17, 17, 0.10), 0 4px 12px rgba(17, 17, 17, 0.05);\n  --shadow-inset: inset 0 1px 2px rgba(17, 17, 17, 0.06);\n\n  /* ---------- MOTION ---------- */\n  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in-out:  cubic-bezier(0.65, 0, 0.35, 1);\n  --ease-soft:    cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:     120ms;\n  --dur-base:     220ms;\n  --dur-slow:     420ms;\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   ============================================================ */\n\nhtml, body {\n  background: var(--bg);\n  color: var(--fg-1);\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-display);\n  color: var(--fg-1);\n  font-weight: 700;\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  margin: 0;\n  text-wrap: balance;\n}\n\n.display, h1.display {\n  font-size: var(--fs-display);\n  font-weight: 800;\n}\nh1 { font-size: var(--fs-h1); font-weight: 700; }\nh2 { font-size: var(--fs-h2); font-weight: 700; }\nh3 { font-size: var(--fs-h3); font-weight: 600; line-height: var(--lh-snug); }\nh4 { font-size: var(--fs-h4); font-weight: 600; line-height: var(--lh-snug); }\n\n/* Italic display (for the V-style accent in headlines) */\nem.italic-accent, .italic-accent {\n  font-family: var(--font-display-italic);\n  font-style: italic;\n  font-weight: 500;\n}\n\np {\n  margin: 0 0 var(--space-4) 0;\n  color: var(--fg-2);\n  text-wrap: pretty;\n  max-width: 65ch;\n}\np.lead { font-size: var(--fs-body-lg); color: var(--fg-1); }\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--fs-eyebrow);\n  font-weight: 700;\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent);\n}\n\na {\n  color: var(--accent);\n  text-decoration: none;\n  border-bottom: 1px solid currentColor;\n  transition: opacity var(--dur-fast) var(--ease-out);\n}\na:hover { opacity: 0.7; }\n\nsmall, .caption {\n  font-size: var(--fs-caption);\n  color: var(--fg-3);\n}\n\ncode, kbd, pre {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n\n::selection {\n  background: var(--peach);\n  color: var(--ink);\n}\n\n/* ============================================================\n   BRAND DECORATIONS — Soulignage (hand-drawn underlines)\n   ============================================================\n\n   Wrap any inline text in a span with one of these classes to add\n   a hand-drawn underline that sits below the baseline. Pair the\n   class with a métier (or any color) variant.\n\n   Example:\n     <h2>Trouver <span class=\"adv-souligne adv-souligne-1 adv-souligne-viridian\">votre voie<\u002Fspan><\u002Fh2>\n*/\n\n.adv-souligne {\n  position: relative;\n  display: inline-block;\n  white-space: nowrap;  /* avoid breaking the underlined run across lines */\n}\n.adv-souligne::after {\n  content: '';\n  position: absolute;\n  left: -4%;\n  right: -4%;\n  top: 100%;\n  height: 0.32em;\n  margin-top: 0.06em;\n  background-position: center;\n  background-repeat: no-repeat;\n  background-size: 100% 100%;\n  pointer-events: none;\n}\n\n/* Family 1 — two parallel arcs (graphic, confident) */\n\n/* Family 2 — single brush sweep (softer, painterly) */\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #111; }\n  :root {\n    --t-eyebrow: 24px; --t-title: 64px; --t-subtitle: 44px; --t-body: 34px; --t-small: 28px;\n    --pad-x: 112px; --pad-top: 88px; --pad-bottom: 80px; --gap-title: 48px; --gap-item: 24px;\n    --violet: #5D5E96; --violet-mid: #8081BD; --peri: #DAE0F3;\n  }\n  a { color: #5D5E96; }\n  a:hover { opacity: 0.7; }\n  @keyframes advUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }\n  @keyframes advFade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes advBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  @keyframes advPop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }\n  @media (prefers-reduced-motion: no-preference) {\n    [data-deck-active] [data-anim=\"up\"] { animation: advUp 0.55s cubic-bezier(0.22,1,0.36,1) both; }\n    [data-deck-active] [data-anim=\"fade\"] { animation: advFade 0.6s cubic-bezier(0.22,1,0.36,1) both; }\n    [data-deck-active] [data-anim=\"pop\"] { animation: advPop 0.5s cubic-bezier(0.22,1,0.36,1) both; }\n    [data-deck-active] [data-anim=\"bar\"] { animation: advBar 0.9s 0.15s cubic-bezier(0.22,1,0.36,1) both; transform-origin: left center; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"cb1455d9-e4a6-4ea2-b8a0-2706d095b064#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n  <section data-label=\"Couverture\" data-screen-label=\"01\" data-speaker-notes=\"Accueil. Tour de table : prénom, ancienneté, un test déjà utilisé, une attente pour ce matin.\" style=\"background: var(--peri); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;\">\n    <img src=\"e8d2b42b-40ce-400a-9793-2e0d8a0548d9\" alt=\"\" style=\"position: absolute; right: 96px; bottom: 96px; width: 420px; opacity: 0.95; transform: rotate(-6deg);\" data-anim=\"pop\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Formation · Qualiopi<\u002Fp>\n    <h1 data-anim=\"up\" style=\"animation-delay: 0.1s; font-family: var(--font-display); font-size: 104px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em; margin: 32px 0 0; max-width: 20ch; color: var(--ink);\">Utiliser les Tests ApySkills<\u002Fh1>\n    <p data-anim=\"up\" style=\"animation-delay: 0.2s; margin: 40px 0 0; font-size: var(--t-body); color: var(--ink-soft); max-width: 24ch;\">Formation collective · une demi-journée, 3 h 30<\u002Fp>\n    <p data-anim=\"up\" style=\"animation-delay: 0.26s; margin: 12px 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Version 3 — 18 octobre 2026<\u002Fp>\n    <img src=\"db0894a8-1f07-41f8-8f38-d36d570ec9f4\" alt=\"Arbre de Vie\" style=\"position: absolute; left: var(--pad-x); bottom: 56px; height: 66px;\">\n  <\u002Fsection>\n\n  <section data-label=\"Le parcours de la matinée\" data-screen-label=\"02\" data-speaker-notes=\"Annoncer le déroulé et l'heure de la pause. Rappeler que le quizz de 30 questions clôt la matinée, seuil 60 %.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Déroulé<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Le parcours de la matinée<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;\">\n      <div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border-radius: 14px; padding: 36px 32px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 14px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet-mid); font-weight: 700;\">0<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px;\">Accueil et cadre<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">20 min · la case Qualiopi, le périmètre<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.2s; background: #fff; border-radius: 14px; padding: 36px 32px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 14px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet-mid); font-weight: 700;\">1<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px;\">Un test, à quoi ça sert ?<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">30 min · posture, déontologie, les mots<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.26s; background: #fff; border-radius: 14px; padding: 36px 32px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 14px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet-mid); font-weight: 700;\">2<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px;\">Les six outils<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">65 min · lire chaque résultat, trois mises en pratique<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.32s; background: #fff; border-radius: 14px; padding: 36px 32px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 14px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet-mid); font-weight: 700;\">3<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px;\">Dans l’application<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">25 min · confier, suivre, tracer<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.38s; background: #fff; border-radius: 14px; padding: 36px 32px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 14px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet-mid); font-weight: 700;\">4<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px;\">Restituer<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">35 min · la trame en 5 temps<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.44s; background: var(--violet); border-radius: 14px; padding: 36px 32px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; gap: 14px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--peach); font-weight: 700;\">5<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; color: var(--cream);\">Évaluation<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--peri);\">20 min · quizz de 30 questions · seuil 60 %<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fade\" style=\"animation-delay: 0.5s; margin: auto 0 0; font-size: var(--t-small); color: var(--slate); max-width: none;\">Total : 3 h 15 de modules (20 + 30 + 65 + 25 + 35 + 20 min) + 15 minutes de pause après le module 2 = 3 h 30.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"§ 0 — Le cadre\" data-screen-label=\"03\" data-speaker-notes=\"Section : pourquoi cette formation existe et ce qu'elle couvre.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Module 0 · 20 minutes<\u002Fp>\n    <p data-anim=\"fade\" style=\"margin: 16px 0 0; font-family: var(--font-display); font-size: 200px; line-height: 0.9; color: var(--peach); opacity: 0.4; font-weight: 700;\">0<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.12s; font-family: var(--font-display); font-size: 88px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em; margin: 48px 0 0; color: var(--cream); max-width: 18ch;\">Le cadre<\u002Fh2>\n  <\u002Fsection>\n\n  <section data-label=\"La case Qualiopi\" data-screen-label=\"04\" data-speaker-notes=\"Cliquez sur la case à l'écran : sans elle, l'onglet Questionnaires et tests ne montre que les questionnaires. C'est cette case que la formation permet d'obtenir.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: grid; grid-template-columns: 1fr 1fr; gap: 88px; align-items: center; box-sizing: border-box; overflow: hidden;\">\n    <div>\n      <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Pourquoi cette formation<\u002Fp>\n      <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 32px; max-width: 16ch;\">Une case dans votre fiche consultante<\u002Fh2>\n      <p data-anim=\"up\" style=\"animation-delay: 0.14s; margin: 0 0 24px; font-size: var(--t-body); color: var(--ink-soft); max-width: 30ch;\">Qualiopi demande qu’une personne qui fait passer un test soit formée à l’usage de ce test.<\u002Fp>\n      <p data-anim=\"up\" style=\"animation-delay: 0.2s; margin: 0; font-size: var(--t-small); color: var(--slate); max-width: 34ch;\">Arbre de Vie est l’éditeur des tests fournis dans l’application : cette formation est la formation de l’éditeur à ses instruments. À l’issue, le cabinet coche la case sur présentation du certificat de réalisation.<\u002Fp>\n    <\u002Fdiv>\n    <div data-anim=\"pop\" style=\"background: #fff; border-radius: 20px; padding: 32px 36px; box-shadow: 0 24px 48px rgba(17,17,17,0.10); display: flex; flex-direction: column; gap: 18px;\">\n      <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--slate);\">Habilitations métier<\u002Fp>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleCase }}\" style=\"display: flex; align-items: center; gap: 24px; background: none; border: none; padding: 0; cursor: pointer; text-align: left; font-family: var(--font-sans);\">\n        <span style=\"width: 56px; height: 56px; border-radius: 10px; border: 3px solid {{ caseBd }}; background: {{ caseBg }}; display: flex; align-items: center; justify-content: center; flex: none; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"{{ caseTick }}\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"font-size: 32px; font-weight: 600; color: var(--ink);\">Tests ApySkills<\u002Fspan>\n      <\u002Fbutton>\n      <div style=\"height: 1px; background: var(--mist);\"><\u002Fdiv>\n      <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--slate);\">Fenêtre « Confier » → Questionnaires et tests<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft); background: var(--mist); border-radius: 999px; padding: 10px 22px; grid-column: 1 / -1;\">Questionnaires du bilan<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); background: var(--peri); border-radius: 999px; padding: 10px 22px; opacity: {{ caseOpa }}; transition: opacity 420ms 0ms cubic-bezier(0.22,1,0.36,1);\">Ma Boussole<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); background: var(--peri); border-radius: 999px; padding: 10px 22px; opacity: {{ caseOpa }}; transition: opacity 420ms 50ms cubic-bezier(0.22,1,0.36,1);\">Mon Horizon<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); background: var(--peri); border-radius: 999px; padding: 10px 22px; opacity: {{ caseOpa }}; transition: opacity 420ms 100ms cubic-bezier(0.22,1,0.36,1);\">Mes 5 Facettes<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); background: var(--peri); border-radius: 999px; padding: 10px 22px; opacity: {{ caseOpa }}; transition: opacity 420ms 150ms cubic-bezier(0.22,1,0.36,1);\">Mes Talents Professionnels<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); background: var(--peri); border-radius: 999px; padding: 10px 22px; opacity: {{ caseOpa }}; transition: opacity 420ms 200ms cubic-bezier(0.22,1,0.36,1);\">Mon Mode d’Emploi<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--violet); background: var(--peri); border-radius: 999px; padding: 10px 22px; opacity: {{ caseOpa }}; transition: opacity 420ms 250ms cubic-bezier(0.22,1,0.36,1);\">Mon ADN<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 24px; color: var(--slate);\">{{ caseHint }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Les six outils\" data-screen-label=\"05\" data-speaker-notes=\"Vue d'ensemble. L'application affiche 10 tests, mais il n'y a que 6 outils : quatre existent en version adultes et en version Collège &amp; Lycée (même barème, phrases adaptées). Deux n'ont qu'une version : Mon Horizon (jeunes) et Mes Talents Professionnels (adultes, le plus complet). On les verra un par un, dans cet ordre.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Ce que la formation couvre<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 20px 0 24px;\">Six outils, dix tests<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 28px;\">\n      <div data-anim=\"up\" style=\"animation-delay: 0.12s; background: #fff; border-radius: 14px; padding: 22px 28px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 1<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.15;\">Ma Boussole<\u002Fh3>\n        <p style=\"margin: 0; font-size: 25px; color: var(--ink-soft); line-height: 1.35;\">Les intérêts professionnels<\u002Fp>\n        <div style=\"height: 2px; background: var(--peri); margin: 4px 0 0;\"><\u002Fdiv>\n        <p style=\"margin: 0; font-size: 24px; color: var(--violet); font-weight: 600;\">Adultes · Collège et lycée<\u002Fp>\n        <p style=\"margin: 0; font-size: 24px; color: var(--ink-soft);\">48 questions · 12 min<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.16s; background: #fff; border-radius: 14px; padding: 22px 28px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 2<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.15;\">Mon Horizon<\u002Fh3>\n        <p style=\"margin: 0; font-size: 25px; color: var(--ink-soft); line-height: 1.35;\">Profil, filières et métiers<\u002Fp>\n        <div style=\"height: 2px; background: var(--peri); margin: 4px 0 0;\"><\u002Fdiv>\n        <p style=\"margin: 0; font-size: 24px; color: var(--violet); font-weight: 600;\">Collège et lycée<\u002Fp>\n        <p style=\"margin: 0; font-size: 24px; color: var(--ink-soft);\">40 questions · 10 min<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.2s; background: #fff; border-radius: 14px; padding: 22px 28px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 3<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.15;\">Mes 5 Facettes<\u002Fh3>\n        <p style=\"margin: 0; font-size: 25px; color: var(--ink-soft); line-height: 1.35;\">La personnalité en 5 dimensions<\u002Fp>\n        <div style=\"height: 2px; background: var(--peri); margin: 4px 0 0;\"><\u002Fdiv>\n        <p style=\"margin: 0; font-size: 24px; color: var(--violet); font-weight: 600;\">Adultes · Collège et lycée<\u002Fp>\n        <p style=\"margin: 0; font-size: 24px; color: var(--ink-soft);\">50 questions · 15 min<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.24s; background: #fff; border-radius: 14px; padding: 22px 28px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 4<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.15;\">Mes Talents Professionnels<\u002Fh3>\n        <p style=\"margin: 0; font-size: 25px; color: var(--ink-soft); line-height: 1.35;\">Le plus complet, 14 dimensions<\u002Fp>\n        <div style=\"height: 2px; background: var(--peri); margin: 4px 0 0;\"><\u002Fdiv>\n        <p style=\"margin: 0; font-size: 24px; color: var(--violet); font-weight: 600;\">Adultes<\u002Fp>\n        <p style=\"margin: 0; font-size: 24px; color: var(--ink-soft);\">112 questions · 15 min<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.28s; background: #fff; border-radius: 14px; padding: 22px 28px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 5<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.15;\">Mon Mode d’Emploi<\u002Fh3>\n        <p style=\"margin: 0; font-size: 25px; color: var(--ink-soft); line-height: 1.35;\">Les préférences de fonctionnement<\u002Fp>\n        <div style=\"height: 2px; background: var(--peri); margin: 4px 0 0;\"><\u002Fdiv>\n        <p style=\"margin: 0; font-size: 24px; color: var(--violet); font-weight: 600;\">Adultes · Collège et lycée<\u002Fp>\n        <p style=\"margin: 0; font-size: 24px; color: var(--ink-soft);\">40 questions · 10 min<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.32s; background: #fff; border-radius: 14px; padding: 22px 28px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 6<\u002Fp>\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.15;\">Mon ADN<\u002Fh3>\n        <p style=\"margin: 0; font-size: 25px; color: var(--ink-soft); line-height: 1.35;\">9 profils de motivation<\u002Fp>\n        <div style=\"height: 2px; background: var(--peri); margin: 4px 0 0;\"><\u002Fdiv>\n        <p style=\"margin: 0; font-size: 24px; color: var(--violet); font-weight: 600;\">Adultes · Collège et lycée<\u002Fp>\n        <p style=\"margin: 0; font-size: 24px; color: var(--ink-soft);\">45 questions · 12 min<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fade\" style=\"animation-delay: 0.4s; margin: 24px 0 0; font-size: var(--t-small); color: var(--violet); background: var(--peri); border-radius: 14px; padding: 18px 32px; max-width: none;\">Quatre outils existent en version adultes et en version Collège &amp; Lycée — même barème, phrases adaptées.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Hors périmètre\" data-screen-label=\"06\" data-speaker-notes=\"À dire clairement : la formation porte exclusivement sur les Tests ApySkills. Ce n’est ni une formation à l’application, ni une formation en psychologie.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">À dire clairement<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Ce que la formation ne couvre pas<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; align-items: stretch;\">\n      <div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px 36px; display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Tests externes<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">La formation d’aujourd’hui ne vise pas à traiter des tests d’autres éditeurs. Elle se concentre exclusivement sur les Tests ApySkills.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.22s; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px 36px; display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">L’utilisation d’ApySkills<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">L’objectif de la formation n’est pas d’apprendre à utiliser l’application, ni en particulier son module des tests — même si, bien entendu, quelques repères pratiques seront donnés.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.3s; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 40px 36px; display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Le diplôme de psychologue<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">Il ne s’agit en aucun cas d’une formation en psychologie. La formation atteste que vous savez utiliser, lire et restituer les instruments d’Arbre de Vie dans un accompagnement, avec les précautions qui vont avec.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"§ 1 — Un test, à quoi ça sert ?\" data-screen-label=\"07\" data-speaker-notes=\"Section : la posture avant l'outil.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Module 1 · 30 minutes<\u002Fp>\n    <p data-anim=\"fade\" style=\"margin: 16px 0 0; font-family: var(--font-display); font-size: 200px; line-height: 0.9; color: var(--peach); opacity: 0.4; font-weight: 700;\">1<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.12s; font-family: var(--font-display); font-size: 88px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em; margin: 48px 0 0; color: var(--cream); max-width: 18ch;\">Un test, à quoi ça sert ?<\u002Fh2>\n  <\u002Fsection>\n\n  <section data-label=\"Les six repères\" data-screen-label=\"08\" data-speaker-notes=\"Cliquez sur chaque repère pour le développer. Ces six repères valent pour les six outils.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Posture et déontologie<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 40px;\">Six repères, avant l’outil<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 1fr 1.2fr; gap: 56px; align-items: start; flex: 1; min-height: 0;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ pickRep0 }}\" style=\"display: flex; align-items: center; gap: 22px; text-align: left; width: 100%; box-sizing: border-box; padding: 20px 30px; border-radius: 999px; border: 2px solid {{ repBd.n0 }}; background: {{ repBg.n0 }}; color: {{ repFg.n0 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n          <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.6;\">1<\u002Fspan>\n          <span>Un support d’échange<\u002Fspan>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ pickRep1 }}\" style=\"display: flex; align-items: center; gap: 22px; text-align: left; width: 100%; box-sizing: border-box; padding: 20px 30px; border-radius: 999px; border: 2px solid {{ repBd.n1 }}; background: {{ repBg.n1 }}; color: {{ repFg.n1 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n          <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.6;\">2<\u002Fspan>\n          <span>On confie avec un but<\u002Fspan>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ pickRep2 }}\" style=\"display: flex; align-items: center; gap: 22px; text-align: left; width: 100%; box-sizing: border-box; padding: 20px 30px; border-radius: 999px; border: 2px solid {{ repBd.n2 }}; background: {{ repBg.n2 }}; color: {{ repFg.n2 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n          <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.6;\">3<\u002Fspan>\n          <span>Le consentement est explicite<\u002Fspan>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ pickRep3 }}\" style=\"display: flex; align-items: center; gap: 22px; text-align: left; width: 100%; box-sizing: border-box; padding: 20px 30px; border-radius: 999px; border: 2px solid {{ repBd.n3 }}; background: {{ repBg.n3 }}; color: {{ repFg.n3 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n          <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.6;\">4<\u002Fspan>\n          <span>Ce qu’un test ne dit pas<\u002Fspan>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ pickRep4 }}\" style=\"display: flex; align-items: center; gap: 22px; text-align: left; width: 100%; box-sizing: border-box; padding: 20px 30px; border-radius: 999px; border: 2px solid {{ repBd.n4 }}; background: {{ repBg.n4 }}; color: {{ repFg.n4 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n          <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.6;\">5<\u002Fspan>\n          <span>Les mots<\u002Fspan>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ pickRep5 }}\" style=\"display: flex; align-items: center; gap: 22px; text-align: left; width: 100%; box-sizing: border-box; padding: 20px 30px; border-radius: 999px; border: 2px solid {{ repBd.n5 }}; background: {{ repBg.n5 }}; color: {{ repFg.n5 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n          <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.6;\">6<\u002Fspan>\n          <span>La trace<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div data-anim=\"fade\" style=\"background: #fff; border-radius: 20px; padding: 48px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); align-self: stretch; display: flex; flex-direction: column;\">\n        <div style=\"display: {{ repShow.n0 }}; flex-direction: column; gap: 28px; flex: 1;\">\n          <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">Un support d’échange<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5;\">Un test n’est pas un verdict. Il met des mots sur ce que la personne sent souvent déjà, il ouvre une conversation — il ne la ferme pas.<\u002Fp>\n          <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Le résultat appartient au bénéficiaire.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: {{ repShow.n1 }}; flex-direction: column; gap: 28px; flex: 1;\">\n          <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">On confie avec un but<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5;\">Avant de cliquer sur « Confier », répondez à : qu’est-ce que je cherche à éclairer dans ce projet ?<\u002Fp>\n          <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Si la réponse est « on verra bien », on ne prescrit pas.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: {{ repShow.n2 }}; flex-direction: column; gap: 28px; flex: 1;\">\n          <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">Le consentement est explicite<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5;\">On explique ce que le test explore, combien de temps il prend, qui verra les résultats — et qu’on peut refuser.<\u002Fp>\n          <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Dans un bilan, c’est aussi la loi : le bénéficiaire est seul destinataire des résultats détaillés.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: {{ repShow.n3 }}; flex-direction: column; gap: 28px; flex: 1;\">\n          <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">Ce qu’un test ne dit pas<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5;\">Il ne dit pas si quelqu’un est « bon » ou « mauvais », ne prédit pas la réussite dans un métier, ne remplace ni l’entretien ni l’expérience vécue.<\u002Fp>\n          <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Mon Mode d’Emploi et Mon ADN : des points de départ de discussion, pas des évaluations validées.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: {{ repShow.n4 }}; flex-direction: column; gap: 28px; flex: 1;\">\n          <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">Les mots<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5;\">Jamais « vous êtes », « votre type, c’est », « ça confirme que », « vous n’êtes pas fait pour ». À la place : « le test suggère », « qu’est-ce que ça vous évoque ? ».<\u002Fp>\n          <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">La différence tient en quelques mots, et elle change tout.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: {{ repShow.n5 }}; flex-direction: column; gap: 28px; flex: 1;\">\n          <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">La trace<\u002Fh3>\n          <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5;\">Chaque passation est inscrite au journal Qualiopi du dossier, et les résultats rejoignent le dossier de preuves.<\u002Fp>\n          <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Rien ne se fait à côté de l’application.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Les mots\" data-screen-label=\"09\" data-speaker-notes=\"Faire retourner les quatre cartes : à gauche ce qu'on ne dit jamais, au dos ce qu'on dit à la place.\" style=\"background: var(--peri); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Repère 5 · les mots<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 16px;\">Ce qu’on ne dit jamais — et ce qu’on dit à la place<\u002Fh2>\n    <p data-anim=\"up\" style=\"animation-delay: 0.14s; margin: 0 0 40px; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Cliquez une carte pour la retourner.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; flex: 1; min-height: 0;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ flipMot0 }}\" style=\"display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 44px 36px; border-radius: 20px; border: none; background: {{ motBg.n0 }}; color: {{ motFg.n0 }}; font-family: var(--font-display); font-size: 36px; font-weight: 600; line-height: 1.25; cursor: pointer; box-shadow: 0 8px 24px rgba(17,17,17,0.08); transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"display: {{ motFront.n0 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.75;\">On ne dit jamais<\u002Fspan>\n          <span>« vous êtes… »<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display: {{ motBack.n0 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.8;\">On dit plutôt<\u002Fspan>\n          <span>« le test suggère… »<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ flipMot1 }}\" style=\"display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 44px 36px; border-radius: 20px; border: none; background: {{ motBg.n1 }}; color: {{ motFg.n1 }}; font-family: var(--font-display); font-size: 36px; font-weight: 600; line-height: 1.25; cursor: pointer; box-shadow: 0 8px 24px rgba(17,17,17,0.08); transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"display: {{ motFront.n1 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.75;\">On ne dit jamais<\u002Fspan>\n          <span>« votre type, c’est… »<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display: {{ motBack.n1 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.8;\">On dit plutôt<\u002Fspan>\n          <span>« qu’est-ce que ça vous évoque ? »<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ flipMot2 }}\" style=\"display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 44px 36px; border-radius: 20px; border: none; background: {{ motBg.n2 }}; color: {{ motFg.n2 }}; font-family: var(--font-display); font-size: 36px; font-weight: 600; line-height: 1.25; cursor: pointer; box-shadow: 0 8px 24px rgba(17,17,17,0.08); transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"display: {{ motFront.n2 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.75;\">On ne dit jamais<\u002Fspan>\n          <span>« ça confirme que… »<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display: {{ motBack.n2 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.8;\">On dit plutôt<\u002Fspan>\n          <span>« est-ce que vous vous y reconnaissez ? »<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ flipMot3 }}\" style=\"display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 44px 36px; border-radius: 20px; border: none; background: {{ motBg.n3 }}; color: {{ motFg.n3 }}; font-family: var(--font-display); font-size: 36px; font-weight: 600; line-height: 1.25; cursor: pointer; box-shadow: 0 8px 24px rgba(17,17,17,0.08); transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"display: {{ motFront.n3 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.75;\">On ne dit jamais<\u002Fspan>\n          <span>« vous n’êtes pas fait pour… »<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display: {{ motBack.n3 }}; flex-direction: column; gap: 24px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; opacity: 0.8;\">On dit plutôt<\u002Fspan>\n          <span>« qu’est-ce que ça change pour la suite ? »<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Trois situations\" data-screen-label=\"10\" data-speaker-notes=\"Faire voter le groupe à main levée avant de cliquer. Le désaccord et la discussion valent plus que la bonne réponse.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Discussion<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 36px;\">Trois situations à trancher<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; flex: 1; min-height: 0;\">\n      <div style=\"background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; display: flex; flex-direction: column; gap: 22px; min-height: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet-mid);\">Situation A<\u002Fp>\n        <p style=\"margin: 0; font-size: 27px; color: var(--ink); line-height: 1.4;\">Un bénéficiaire obtient un Névrosisme élevé à Mes 5 Facettes et demande : « ça veut dire que je suis fragile ? »<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ sitA0 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitA.b0 }}; background: {{ sitA.g0 }}; color: {{ sitA.f0 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">« Oui, c’est ce que le test indique. »<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ sitA1 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitA.b1 }}; background: {{ sitA.g1 }}; color: {{ sitA.f1 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">« Non : c’est une sensibilité au stress, une tendance, pas un état. Qu’est-ce qui vous aide à récupérer ? »<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ sitA2 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitA.b2 }}; background: {{ sitA.g2 }}; color: {{ sitA.f2 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">« Ce trait ne se commente pas. »<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"display: {{ sitA.fb }}; margin: auto 0 0; font-size: 24px; color: var(--violet); font-weight: 600; line-height: 1.4;\">Recadrer : sensibilité au stress n’est pas fragilité — et la bonne question devient celle de la récupération.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; display: flex; flex-direction: column; gap: 22px; min-height: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet-mid);\">Situation B<\u002Fp>\n        <p style=\"margin: 0; font-size: 27px; color: var(--ink); line-height: 1.4;\">Un employeur qui finance un bilan demande à voir « les résultats des tests ».<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ sitB0 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitB.b0 }}; background: {{ sitB.g0 }}; color: {{ sitB.f0 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">On les envoie : c’est lui qui finance.<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ sitB1 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitB.b1 }}; background: {{ sitB.g1 }}; color: {{ sitB.f1 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">On refuse : les résultats détaillés sont réservés au bénéficiaire.<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ sitB2 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitB.b2 }}; background: {{ sitB.g2 }}; color: {{ sitB.f2 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">On envoie seulement Ma Boussole, moins sensible.<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"display: {{ sitB.fb }}; margin: auto 0 0; font-size: 24px; color: var(--violet); font-weight: 600; line-height: 1.4;\">Seule la synthèse que le bénéficiaire choisit de partager peut circuler.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; display: flex; flex-direction: column; gap: 22px; min-height: 0;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet-mid);\">Situation C<\u002Fp>\n        <p style=\"margin: 0; font-size: 27px; color: var(--ink); line-height: 1.4;\">Une lycéenne de 2de obtient un Ma Boussole « RIC » et sa mère conclut : « donc ingénieure ».<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ sitC0 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitC.b0 }}; background: {{ sitC.g0 }}; color: {{ sitC.f0 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">Confirmer : le code désigne bien une famille de métiers.<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ sitC1 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitC.b1 }}; background: {{ sitC.g1 }}; color: {{ sitC.f1 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">Proposer un autre test pour arbitrer.<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ sitC2 }}\" style=\"text-align: left; padding: 16px 22px; border-radius: 14px; border: 2px solid {{ sitC.b2 }}; background: {{ sitC.g2 }}; color: {{ sitC.f2 }}; font-family: var(--font-sans); font-size: 24px; line-height: 1.35; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">Rappeler que le code décrit des intérêts, pas un métier, et explorer avec la jeune ce que R et I évoquent dans sa vie.<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"display: {{ sitC.fb }}; margin: auto 0 0; font-size: 24px; color: var(--violet); font-weight: 600; line-height: 1.4;\">On reprend la main en ouvrant plusieurs filières, à partir de ce que la jeune dit elle-même.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"§ 2 — Les six outils\" data-screen-label=\"11\" data-speaker-notes=\"Section : ce que chaque outil mesure et comment lire son résultat, un outil à la fois. Pour tenir les 65 minutes (dont trois mises en pratique : Ma Boussole et Mes 5 Facettes, 10 minutes chacune ; Mon ADN, 5 minutes), passer vite sur les versions jeunes : même barème que les adultes. Chacune ouvre son propre résultat avec sa fiche de lecture.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Module 2 · 65 minutes<\u002Fp>\n    <p data-anim=\"fade\" style=\"margin: 16px 0 0; font-family: var(--font-display); font-size: 200px; line-height: 0.9; color: var(--peach); opacity: 0.4; font-weight: 700;\">2<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.12s; font-family: var(--font-display); font-size: 88px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em; margin: 48px 0 0; color: var(--cream); max-width: 18ch;\">Les six outils, un par un<\u002Fh2>\n  <\u002Fsection>\n\n  <section data-label=\"Ma Boussole — ce que c’est\" data-screen-label=\"12\" data-speaker-notes=\"Ma Boussole est un outil qui permet d&#x27;aider une personne à mieux comprendre ce qui l&#x27;attire dans le monde professionnel. Comme une boussole, il ne décide pas de la destination à notre place : il nous donne des repères pour nous orienter. Il s&#x27;appuie sur le modèle RIASEC, qui identifie six grandes familles d&#x27;intérêts professionnels. Notre rôle, en tant que consultante, est d&#x27;aider la personne à comprendre ses résultats et à les mettre en perspective avec son parcours, ses compétences, ses valeurs et ses aspirations.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Outil 1 · Ma Boussole · 48 questions · 12 min<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 20px;\">Comme une boussole : des repères, pas une destination<\u002Fh2>\n    <p data-anim=\"up\" style=\"animation-delay: 0.12s; margin: 0 0 32px; font-size: 28px; line-height: 1.45; color: var(--ink-soft); max-width: 62ch; text-wrap: pretty;\">Ma Boussole aide une personne à mieux comprendre ce qui l’attire dans le monde professionnel. Il s’appuie sur le modèle RIASEC : six grandes familles d’intérêts professionnels.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 28px; display: fl
