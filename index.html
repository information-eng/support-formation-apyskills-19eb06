ex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">R — Réaliste<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Faire, construire, manipuler.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">I — Investigateur<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Analyser, comprendre, rechercher.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">A — Artistique<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Créer, imaginer, exprimer.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">S — Social<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Aider, accompagner, transmettre.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.38s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">E — Entreprenant<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Convaincre, entreprendre, diriger.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.44s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">C — Conventionnel<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Organiser, structurer, vérifier.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.5s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Notre rôle : aider la personne à comprendre ses résultats et à les mettre en perspective avec son parcours, ses compétences, ses valeurs et ses aspirations.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Ma Boussole — l’hexagone\" data-screen-label=\"13\" data-speaker-notes=\"Cliquez chaque lettre. Les types voisins vont bien ensemble ; deux types opposés décrivent des facettes contrastées.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; box-sizing: border-box; overflow: hidden;\">\n    <div>\n      <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 1 · Ma Boussole · 48 questions · 12 min<\u002Fp>\n      <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 28px; max-width: 18ch;\">Intérêts professionnels : ce que la personne aime faire<\u002Fh2>\n      <p data-anim=\"up\" style=\"animation-delay: 0.14s; margin: 0 0 36px; font-size: var(--t-small); color: var(--slate); max-width: 34ch;\">8 phrases par type, notées de 1 à 5. On additionne par type, et on retient les trois plus forts, dans l’ordre.<\u002Fp>\n      <div data-anim=\"fade\" style=\"background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; gap: 18px; min-height: 300px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">{{ hexTitre }}<\u002Fp>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.45;\">{{ hexTexte }}<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet-mid); font-weight: 600;\">{{ hexVoisins }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"pop\" style=\"position: relative; width: 640px; height: 640px; justify-self: center;\">\n      <div style=\"position: absolute; inset: 60px; border-radius: 50%; border: 2px dashed var(--pebble);\"><\u002Fdiv>\n      <p style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; font-family: var(--font-display); font-size: 64px; font-weight: 700; color: var(--violet); letter-spacing: 0.08em;\">{{ hexCode }}<\u002Fp>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickR }}\" style=\"position: absolute; left: 29%; top: 8%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--violet-mid); background: {{ hexBg.R }}; color: {{ hexFg.R }}; font-family: var(--font-display); font-size: 46px; font-weight: 700; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center;\">R<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickI }}\" style=\"position: absolute; left: 71%; top: 8%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--violet-mid); background: {{ hexBg.I }}; color: {{ hexFg.I }}; font-family: var(--font-display); font-size: 46px; font-weight: 700; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center;\">I<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickA }}\" style=\"position: absolute; left: 92%; top: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--violet-mid); background: {{ hexBg.A }}; color: {{ hexFg.A }}; font-family: var(--font-display); font-size: 46px; font-weight: 700; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center;\">A<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickS }}\" style=\"position: absolute; left: 71%; top: 92%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--violet-mid); background: {{ hexBg.S }}; color: {{ hexFg.S }}; font-family: var(--font-display); font-size: 46px; font-weight: 700; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center;\">S<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickE }}\" style=\"position: absolute; left: 29%; top: 92%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--violet-mid); background: {{ hexBg.E }}; color: {{ hexFg.E }}; font-family: var(--font-display); font-size: 46px; font-weight: 700; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center;\">E<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickC }}\" style=\"position: absolute; left: 8%; top: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--violet-mid); background: {{ hexBg.C }}; color: {{ hexFg.C }}; font-family: var(--font-display); font-size: 46px; font-weight: 700; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center;\">C<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Ma Boussole — lire les écarts\" data-screen-label=\"14\" data-speaker-notes=\"La première lettre pèse le plus, mais les écarts racontent l'essentiel. Un profil plat invite à creuser en entretien.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Comment on le lit<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Même code, deux histoires différentes<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px;\">\n      <div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border-radius: 20px; padding: 44px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 26px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 38px;\">Une dominante nette<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"display: flex; align-items: center; gap: 22px;\"><span style=\"font-family: var(--font-display); font-size: 32px; width: 32px; color: var(--violet);\">S<\u002Fspan><span data-anim=\"bar\" style=\"height: 34px; width: 76%; background: var(--violet); border-radius: 999px;\"><\u002Fspan><span style=\"font-size: var(--t-small); color: var(--ink-soft);\">38<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 22px;\"><span style=\"font-family: var(--font-display); font-size: 32px; width: 32px; color: var(--violet);\">E<\u002Fspan><span data-anim=\"bar\" style=\"animation-delay: 0.25s; height: 34px; width: 44%; background: var(--violet-mid); border-radius: 999px;\"><\u002Fspan><span style=\"font-size: var(--t-small); color: var(--ink-soft);\">22<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 22px;\"><span style=\"font-family: var(--font-display); font-size: 32px; width: 32px; color: var(--violet);\">A<\u002Fspan><span data-anim=\"bar\" style=\"animation-delay: 0.35s; height: 34px; width: 40%; background: var(--peri); border-radius: 999px;\"><\u002Fspan><span style=\"font-size: var(--t-small); color: var(--ink-soft);\">20<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">Le Social domine largement : on part de là, et les deux autres lettres nuancent.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.22s; background: #fff; border-radius: 20px; padding: 44px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 26px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 38px;\">Un profil plat<\u002Fh3>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"display: flex; align-items: center; gap: 22px;\"><span style=\"font-family: var(--font-display); font-size: 32px; width: 32px; color: var(--violet);\">S<\u002Fspan><span data-anim=\"bar\" style=\"animation-delay: 0.3s; height: 34px; width: 62%; background: var(--violet); border-radius: 999px;\"><\u002Fspan><span style=\"font-size: var(--t-small); color: var(--ink-soft);\">31<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 22px;\"><span style=\"font-family: var(--font-display); font-size: 32px; width: 32px; color: var(--violet);\">E<\u002Fspan><span data-anim=\"bar\" style=\"animation-delay: 0.4s; height: 34px; width: 60%; background: var(--violet-mid); border-radius: 999px;\"><\u002Fspan><span style=\"font-size: var(--t-small); color: var(--ink-soft);\">30<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 22px;\"><span style=\"font-family: var(--font-display); font-size: 32px; width: 32px; color: var(--violet);\">A<\u002Fspan><span data-anim=\"bar\" style=\"animation-delay: 0.5s; height: 34px; width: 58%; background: var(--peri); border-radius: 999px;\"><\u002Fspan><span style=\"font-size: var(--t-small); color: var(--ink-soft);\">29<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">Rien n’est tranché : on ne force pas la première lettre, c’est en entretien qu’on creuse.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Ma Boussole — faire parler les résultats\" data-screen-label=\"15\" data-speaker-notes=\"Il faut faire parler les résultats. Le rôle de la consultante consiste à explorer ce que cela signifie concrètement pour cette personne. Insister sur les trois questions.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Ma Boussole · faire parler les résultats<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Il faut faire parler les résultats<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: stretch;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--peri); border-radius: 20px; padding: 38px 36px; display: flex; flex-direction: column; gap: 20px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Exemple : un profil SAI<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong style=\"color: var(--violet);\">S<\u002Fstrong> · elle manifeste un intérêt pour la relation humaine.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong style=\"color: var(--violet);\">A<\u002Fstrong> · elle apprécie potentiellement la créativité et la liberté d’expression.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong style=\"color: var(--violet);\">I<\u002Fstrong> · elle aime comprendre, analyser et approfondir.<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Le rôle de la consultante : explorer ce que cela signifie concrètement pour cette personne.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.22s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 38px 36px; display: flex; flex-direction: column; gap: 20px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Trois questions à poser<\u002Fh3><p style=\"margin: 0; font-size: 27px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Qu’est-ce qui vous ressemble le plus dans Ma Boussole ? »<\u002Fp><p style=\"margin: 0; font-size: 27px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Où retrouvez-vous ces intérêts dans votre parcours ? »<\u002Fp><p style=\"margin: 0; font-size: 27px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Comment pourriez-vous les mobiliser dans un futur projet professionnel ? »<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mise en pratique — Ma Boussole\" data-screen-label=\"16\" data-speaker-notes=\"Laisser le groupe proposer avant de dérouler les quatre étapes. Ma Boussole ne donne pas une réponse toute faite : elle permet à la personne de mieux se connaître pour faire des choix plus éclairés. Notre valeur ajoutée en tant que consultantes, ce n&#x27;est pas de donner une signification définitive à un résultat : c&#x27;est d&#x27;aider chaque personne à transformer ses repères en pistes concrètes, puis en projet professionnel.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mise en pratique · Ma Boussole · 10 min<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 12px;\">Une situation<\u002Fh2>\n    <blockquote data-anim=\"up\" style=\"animation-delay: 0.1s; margin: 8px 0 30px; font-family: var(--font-display); font-size: 40px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; max-width: 46ch; color: var(--ink);\">« Une bénéficiaire vous dit qu’elle ne trouve plus de sens dans son poste administratif. Elle aime aider ses collègues, créer des supports et comprendre les problèmes. Comment utilisez-vous Ma Boussole pour l’accompagner ? »<\u002Fblockquote>\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\"><div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">1<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Explorer<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">les activités qui plaisent réellement à la personne.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">2<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Relier<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">ses intérêts et ses expériences.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">3<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Identifier<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">plusieurs métiers ou environnements à explorer.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.28s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">4<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Vérifier<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">la cohérence de ces pistes avec ses compétences, ses contraintes et la réalité du marché du travail.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.4s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Notre valeur ajoutée : aider chaque personne à transformer ses repères en pistes concrètes, puis en projet professionnel.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mon Horizon — ce que c’est\" data-screen-label=\"17\" data-speaker-notes=\"Mon Horizon est un outil d&#x27;aide à l&#x27;orientation destiné aux collégiens et aux lycéens. L&#x27;objectif n&#x27;est pas de dire à un jeune quel métier il doit faire, ni de décider à sa place. Le test s&#x27;appuie sur six grands types de profils (R, I, A, S, E, C) ; les résultats dégagent les types qui ressortent le plus, mais aussi celui qui est le moins présent. Notre rôle : transformer ces résultats en pistes de réflexion concrètes.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Outil 2 · Mon Horizon · collège et lycée<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 20px;\">Ouvrir des possibles, pas décider à sa place<\u002Fh2>\n    <p data-anim=\"up\" style=\"animation-delay: 0.12s; margin: 0 0 32px; font-size: 28px; line-height: 1.45; color: var(--ink-soft); max-width: 62ch; text-wrap: pretty;\">Aider le jeune à mieux comprendre ses centres d’intérêt, à identifier des pistes qui pourraient lui correspondre, et à découvrir des possibilités auxquelles il n’aurait pas forcément pensé.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--peri); border-radius: 20px; padding: 30px 30px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">40 questions<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Une dizaine de minutes. Six grands types de profils : R, I, A, S, E, C.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 30px 30px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">15 filières d’études<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Du CAP au master, avec les niveaux d’études possibles.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 30px 30px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Plus de 250 métiers<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Répartis en 10 familles, classés par proximité avec le profil.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.4s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Notre rôle : transformer ces résultats en pistes de réflexion concrètes — mettre des mots sur ses intérêts, faire des liens avec son parcours scolaire, explorer les métiers proposés et vérifier qu’ils correspondent réellement à ses envies.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mon Horizon — lire le résultat\" data-screen-label=\"18\" data-speaker-notes=\"40 questions de 3 activités : le jeune coche celle qui lui ressemble le plus et celle qui lui ressemble le moins. Même base de 6 types que Ma Boussole, mais le rapport va jusqu'aux filières et aux métiers. Vigilance : le pourcentage compare la forme du profil du jeune à celle du métier, pas aux autres jeunes. Un profil plat donne environ 50 % partout : c'est une vraie information à discuter avec lui.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 2 · 40 questions · 10 min · collège et lycée<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 36px;\">Mon Horizon<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 64px; flex: 1; min-height: 0; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <div data-anim=\"up\" style=\"animation-delay: 0.12s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">1<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Un profil sur 6 types<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">R, I, A, S, E, C notés sur 10 : une première photographie de ses centres d’intérêt, pas une étiquette définitive.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">2<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Un code à 3 lettres<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">Par exemple « RIE » : les trois types qui ressortent le plus. Un point d’entrée pour engager le dialogue.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.2s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">3<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">15 profils combinés<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">En croisant deux types (RI, SA…), on affine la réflexion — sans réduire le jeune à un seul domaine.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">4<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">15 filières d’études<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">Du CAP au master : le lien avec les possibilités de formation — sans faire du classement une prescription.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.28s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">5<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Plus de 250 métiers, 10 familles<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">Un top 10 pour commencer : la partie qui ouvre concrètement le champ des possibles.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div data-anim=\"up\" style=\"animation-delay: 0.3s; background: #fff; border-radius: 14px; padding: 28px 32px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 14px;\">\n          <p style=\"margin: 0 0 4px; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--slate);\">Lire les pourcentages<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: #fff; background: #4A4B80; border: 2px solid #4A4B80; border-radius: 999px; padding: 4px 0; text-align: center;\">75 % et +<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Très proche de toi »<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: #fff; background: var(--violet); border: 2px solid var(--violet); border-radius: 999px; padding: 4px 0; text-align: center;\">60 – 74 %<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Proche de toi »<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: var(--violet); background: var(--peri); border: 2px solid var(--peri); border-radius: 999px; padding: 4px 0; text-align: center;\">45 – 59 %<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Possible »<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: var(--violet); background: #fff; border: 2px solid var(--violet-mid); border-radius: 999px; padding: 4px 0; text-align: center;\">&lt; 45 %<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Éloigné de toi, pour l’instant »<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.38s; background: var(--peri); border-radius: 14px; padding: 28px 32px; display: flex; flex-direction: column; gap: 10px;\">\n          <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Point de vigilance<\u002Fp>\n          <p style=\"margin: 0; font-size: 26px; line-height: 1.45; color: var(--ink); text-wrap: pretty;\">Le pourcentage compare la forme du profil du jeune à celle du métier, pas aux autres jeunes. Un profil plat donne environ 50 % partout : c’est une information à discuter.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mon Horizon — précautions et questions\" data-screen-label=\"19\" data-speaker-notes=\"Trois précautions à garder en tête, et trois questions pour ouvrir le dialogue avec le jeune.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mon Horizon · avec le jeune<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Un support de dialogue, pas un verdict<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; align-items: stretch;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 34px 34px; display: flex; flex-direction: column; gap: 18px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; color: var(--violet);\">Trois précautions<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong>Un support de dialogue, pas un verdict.<\u002Fstrong> Un score ne définit ni la personnalité entière du jeune ni son avenir professionnel.<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong>Le type le moins présent n’est pas une faiblesse.<\u002Fstrong> Il indique un domaine moins représenté dans les réponses actuelles — pas une incapacité.<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong>Les résultats se confrontent à la réalité.<\u002Fstrong> Envies, expériences, compétences, résultats scolaires, contraintes et possibilités de formation.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.22s; background: var(--peri); border-radius: 20px; padding: 34px 34px; display: flex; flex-direction: column; gap: 18px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; color: var(--violet);\">Trois questions<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Qu’est-ce qui te ressemble le plus dans ces résultats ? »<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Y a-t-il une proposition qui te surprend ou qui ne te correspond pas ? »<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Parmi ces métiers, lequel aimerais-tu découvrir davantage, et pourquoi ? »<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mes 5 Facettes — ce que c’est\" data-screen-label=\"20\" data-speaker-notes=\"Mes 5 Facettes permet de mieux comprendre son fonctionnement à travers cinq grandes dimensions de la personnalité. Les résultats ne définissent pas qui nous sommes de manière définitive : ils constituent un support de réflexion pour mieux se comprendre et identifier des leviers d&#x27;évolution. Avec un jeune, notre rôle n&#x27;est pas de définir qui il est à sa place : nous l&#x27;aidons à comprendre ses résultats, à les confronter à son expérience et à identifier ce qu&#x27;il souhaite conserver, développer ou faire évoluer.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Outil 3 · Mes 5 Facettes · adolescents et adultes<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 20px;\">Mieux se comprendre, sans se figer<\u002Fh2>\n    <p data-anim=\"up\" style=\"animation-delay: 0.12s; margin: 0 0 32px; font-size: 28px; line-height: 1.45; color: var(--ink-soft); max-width: 62ch; text-wrap: pretty;\">Prendre conscience de ses tendances, de ses ressources, de ses préférences et de sa manière d’interagir avec son environnement — à travers cinq grandes dimensions de la personnalité.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--peri); border-radius: 20px; padding: 32px 32px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Pour un adolescent<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Mieux comprendre sa façon d’apprendre, de travailler en groupe ou d’envisager son orientation.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 32px 32px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Pour un adulte<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Réfléchir à son fonctionnement au travail, à ses relations professionnelles, à son style de communication ou à ses besoins dans un environnement professionnel.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.4s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Notre rôle : aider chaque personne à faire le lien entre ses résultats et son vécu, sans jugement ni interprétation figée.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mes 5 Facettes — les cinq curseurs\" data-screen-label=\"21\" data-speaker-notes=\"Chaque trait se lit comme un curseur, pas comme une case. Cliquez un trait : un score bas n'est pas un manque.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 3 · Mes 5 Facettes · 50 questions · 15 min<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 36px;\">Mes 5 Facettes : un profil, pas un code<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; flex: 1; min-height: 0; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n        <sc-for list=\"{{ traits }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <button type=\"button\" sc-camel-on-click=\"{{ t.pick }}\" style=\"display: grid; grid-template-columns: 260px 1fr 60px; align-items: center; gap: 24px; text-align: left; padding: 18px 26px; border-radius: 14px; border: 2px solid {{ t.bd }}; background: {{ t.bg }}; font-family: var(--font-sans); cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n            <span style=\"font-size: 27px; font-weight: 600; color: var(--ink);\">{{ t.nom }}<\u002Fspan>\n            <span style=\"height: 22px; border-radius: 999px; background: var(--mist); display: block; overflow: hidden;\"><span data-anim=\"bar\" style=\"display: block; height: 100%; width: {{ t.pct }}; background: {{ t.fill }}; border-radius: 999px;\"><\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 26px; color: var(--slate); text-align: right;\">{{ t.score }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <p style=\"margin: 8px 0 0; font-size: 24px; color: var(--slate);\">Exemple de profil · scores de 10 à 50 par trait<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fade\" style=\"background: #fff; border-radius: 20px; padding: 44px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; gap: 24px; align-self: stretch;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 40px; color: var(--violet);\">{{ traitNom }}<\u002Fh3>\n        <p style=\"margin: 0; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet-mid);\">Score haut<\u002Fp>\n        <p style=\"margin: 0; font-size: 28px; color: var(--ink-soft); line-height: 1.45;\">{{ traitHaut }}<\u002Fp>\n        <p style=\"margin: 0; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet-mid);\">Score bas<\u002Fp>\n        <p style=\"margin: 0; font-size: 28px; color: var(--ink-soft); line-height: 1.45;\">{{ traitBas }}<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: 26px; color: var(--violet); font-weight: 600; line-height: 1.4;\">{{ traitNote }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mes 5 Facettes — la question à poser\" data-screen-label=\"22\" data-speaker-notes=\"Pour chaque dimension, Amandine propose une question qui fait passer du score au vécu. Tendances : Ouverture — plus forte : aimer explorer, imaginer, expérimenter ; moins forte : préférer le concret, le familier ou les méthodes éprouvées. Conscience — plus forte : apprécier les plans, les échéances et les objectifs précis ; moins forte : davantage de souplesse et d&#x27;improvisation. Extraversion — plus forte : rechercher les échanges, participer facilement, prendre la parole ; moins forte : préférer les petits groupes, le calme ou les temps de réflexion individuelle. Agréabilité — plus forte : rechercher l&#x27;harmonie, aider, privilégier la coopération ; moins forte : davantage questionner, argumenter, défendre son point de vue ou se montrer compétitif. Stabilité émotionnelle — plus forte : retrouver son calme et garder du recul ; moins forte : ressentir plus intensément certaines émotions ou être davantage affecté par le stress.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mes 5 Facettes · les cinq dimensions<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Une question par dimension<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 26px; display: flex; flex-direction: column; gap: 10px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; color: var(--violet);\">1 · L’ouverture à l’expérience<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Curiosité · imagination · nouveauté<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">« Est-ce que tu aimes découvrir de nouvelles façons de faire, ou préfères-tu savoir comment les choses fonctionnent déjà ? »<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 26px; display: flex; flex-direction: column; gap: 10px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; color: var(--violet);\">2 · La conscience et l’organisation<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Organisation · persévérance · rigueur<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">« Quand tu as un travail à rendre, préfères-tu tout planifier à l’avance ou avancer au fur et à mesure ? »<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 26px; display: flex; flex-direction: column; gap: 10px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; color: var(--violet);\">3 · L’extraversion<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Échanges · énergie sociale · affirmation<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">« Après une journée avec beaucoup de monde, est-ce que tu te sens stimulé ou as-tu besoin de retrouver du calme ? »<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 26px; display: flex; flex-direction: column; gap: 10px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; color: var(--violet);\">4 · L’agréabilité<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Coopération · confiance · attention aux autres<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">« En groupe, qu’est-ce qui compte le plus pour toi : que tout le monde s’entende, ou trouver la meilleure solution ? »<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.38s; background: var(--peri); border-radius: 20px; padding: 26px 26px; display: flex; flex-direction: column; gap: 10px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; color: var(--violet);\">5 · La stabilité émotionnelle<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Gestion du stress · réactions émotionnelles · recul<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">« Quand quelque chose ne se passe pas comme prévu, qu’est-ce qui t’aide à retrouver ton équilibre ? »<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Le mot « Névrosisme »\" data-screen-label=\"23\" data-speaker-notes=\"Situation A du module 1 : « ça veut dire que je suis fragile ? » La réponse est non, et la bonne question devient : qu'est-ce qui vous aide à récupérer ? Pour Amandine, on parle de stabilité émotionnelle (gestion du stress, réactions émotionnelles, recul) : la tendance à ressentir des émotions difficiles, à s'inquiéter ou à être déstabilisé face aux tensions et aux imprévus. Elle est souvent mesurée dans l'autre sens sous le nom de neuroticisme. Question à poser : « Quand quelque chose ne se passe pas comme prévu, qu'est-ce qui t'aide à retrouver ton équilibre ? »\" style=\"background: var(--peri); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;\">\n    <img src=\"6f1eb212-7826-4856-aa92-d83cb776cc24\" alt=\"\" style=\"position: absolute; right: 120px; bottom: 90px; width: 300px; transform: rotate(7deg);\" data-anim=\"pop\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Le piège de Mes 5 Facettes<\u002Fp>\n    <blockquote data-anim=\"up\" style=\"animation-delay: 0.1s; margin: 40px 0 0; font-family: var(--font-display); font-size: 68px; font-weight: 500; line-height: 1.2; letter-spacing: -0.015em; max-width: 26ch; color: var(--ink);\">Devant le bénéficiaire, on ne dit pas « névrosisme ». On dit « sensibilité au stress et aux émotions ».<\u002Fblockquote>\n    <p data-anim=\"up\" style=\"animation-delay: 0.2s; margin: 44px 0 0; font-size: var(--t-body); color: var(--violet); font-weight: 600; max-width: 30ch;\">Une manière de réagir, plus ou moins marquée — jamais une pathologie, jamais une fragilité.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mise en pratique — Mes 5 Facettes\" data-screen-label=\"24\" data-speaker-notes=\"Durée conseillée : 10 minutes. Faire voter le groupe avant de donner la réponse. Bonne réponse à la question 1 : « Lui demander s&#x27;il reconnaît ces tendances dans son quotidien. » Bonne réponse à la question 2 : « Il a peut-être certaines préférences à explorer selon les contextes. » Les deux autres propositions enferment le jeune dans un verdict ou dans une injonction.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mise en pratique · Mes 5 Facettes · 10 min<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 16px;\">Passer du score à la question<\u002Fh2>\n    <div data-anim=\"up\" style=\"animation-delay: 0.12s; background: var(--peri); border-radius: 20px; padding: 24px 32px; display: flex; flex-direction: column; gap: 6px;\"><p style=\"margin: 0; font-size: 28px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">Situation : un jeune découvre qu’il a un score élevé en organisation et plus faible en extraversion.<\u002Fp><\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; margin-top: 28px;\"><div data-anim=\"up\" style=\"animation-delay: 0.18s; display: flex; flex-direction: column; gap: 14px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">1. Quelle serait la meilleure première réaction ?<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.35; color: var(--ink); background: #fff; border: 2px solid var(--violet-mid); border-radius: 14px; padding: 16px 22px; text-wrap: pretty; max-width: none;\">Lui annoncer le type de métier qui lui correspond.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.35; color: var(--ink); background: #fff; border: 2px solid var(--violet-mid); border-radius: 14px; padding: 16px 22px; text-wrap: pretty; max-width: none;\">Lui demander s’il reconnaît ces tendances dans son quotidien.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.35; color: var(--ink); background: #fff; border: 2px solid var(--violet-mid); border-radius: 14px; padding: 16px 22px; text-wrap: pretty; max-width: none;\">Lui conseiller de travailler son extraversion.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; display: flex; flex-direction: column; gap: 14px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">2. Que peut-on déduire de ses scores ?<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.35; color: var(--ink); background: #fff; border: 2px solid var(--violet-mid); border-radius: 14px; padding: 16px 22px; text-wrap: pretty; max-width: none;\">Il doit choisir un métier sans contact humain.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.35; color: var(--ink); background: #fff; border: 2px solid var(--violet-mid); border-radius: 14px; padding: 16px 22px; text-wrap: pretty; max-width: none;\">Il a peut-être certaines préférences à explorer selon les contextes.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.35; color: var(--ink); background: #fff; border: 2px solid var(--violet-mid); border-radius: 14px; padding: 16px 22px; text-wrap: pretty; max-width: none;\">Il sera toujours organisé dans toutes les situations.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mes Talents Professionnels — ce que c’est\" data-screen-label=\"25\" data-speaker-notes=\"L&#x27;intérêt de cet outil est de créer des liens entre la connaissance de soi et la réalité professionnelle : comment je travaille, ce qui me motive, les responsabilités que j&#x27;apprécie, le cadre dont j&#x27;ai besoin et les environnements dans lesquels je pourrais donner le meilleur de moi-même. Le rapport va plus loin que la simple description de la personnalité. En tant que consultantes, nous aidons la personne à mettre du sens sur ses résultats, à identifier ses atouts, à prendre conscience de ses points de vigilance et à construire des pistes d&#x27;évolution cohérentes avec ses aspirations.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Outil 4 · Mes Talents Professionnels · adultes<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 20px;\">De la connaissance de soi à la réalité professionnelle<\u002Fh2>\n    <p data-anim=\"up\" style=\"animation-delay: 0.12s; margin: 0 0 32px; font-size: 28px; line-height: 1.45; color: var(--ink-soft); max-width: 62ch; text-wrap: pretty;\">Pour les adultes qui souhaitent mieux comprendre leur fonctionnement professionnel, identifier leurs ressources et réfléchir à leur évolution de carrière.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--peri); border-radius: 20px; padding: 28px 26px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">14 dimensions<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comportement professionnel, motivations et valeurs — chacune entre deux pôles, notée sur 10.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 28px 26px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">Un commentaire par dimension<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Pour comprendre vers quel pôle la personne tend, et avec quelle intensité.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 28px 26px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">2 profils-types<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Ceux qui sont les plus proches du fonctionnement de la personne.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 28px 26px; display: flex; flex-direction: column; gap: 12px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">Près de 300 métiers<\u002Fh3><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Classés selon leur proximité avec le profil, avec les compétences clés.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.45s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Le rapport ne décide pas à la place de la personne. Il lui donne des clés pour mieux comprendre son fonctionnement et devenir actrice de son parcours professionnel.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mes Talents Professionnels — le comportement professionnel\" data-screen-label=\"26\" data-speaker-notes=\"Il faut lire les résultats entre deux pôles, et non comme une liste de qualités ou de défauts ! L&#x27;objectif n&#x27;est pas de déterminer quel pôle est le meilleur, mais de comprendre vers lequel la personne tend.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mes Talents Professionnels · 7 dimensions sur 14<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 22px;\">Le comportement professionnel<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\"><div data-anim=\"up\" style=\"animation-delay: 0.12s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Persuasion <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Transparence<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment la personne cherche à convaincre, exprime ses intentions et communique.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Conciliation <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Fermeté<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle gère les désaccords, négocie et défend ses positions.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Sociabilité <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Réserve<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle entre en relation et dose ses interactions sociales.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Sang-froid <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Sensibilité<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle réagit aux tensions et prend en compte les ressentis.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.28s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Spontanéité <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Méthode<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle passe à l’action : improvisation ou préparation structurée.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Analyse <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Intuition<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle aborde une situation : examen des éléments ou perception globale.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.36s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Respect du cadre <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Esprit critique<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle se positionne face aux règles, aux procédures et aux façons de faire établies.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mes Talents Professionnels — les motivations et les valeurs\" data-screen-label=\"27\" data-speaker-notes=\"Ces sept dimensions aident à comprendre ce qui nourrit l&#x27;engagement professionnel, ce qui donne envie de s&#x27;investir et les conditions de travail recherchées.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mes Talents Professionnels · 7 dimensions sur 14<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 22px;\">Les motivations et les valeurs<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\"><div data-anim=\"up\" style=\"animation-delay: 0.12s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Investissement au travail <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Équilibre de vie<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">La place accordée au travail par rapport aux autres domaines de vie.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Goût des responsabilités <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Besoin de guidance<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Le niveau de responsabilité recherché, et le besoin de repères ou d’accompagnement.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Besoin d’action <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Besoin de réflexion<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">La préférence pour l’action concrète, ou pour le temps d’analyse et de recul.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Ambition <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Stabilité<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">L’attrait pour la progression et les défis, ou pour la continuité et la sécurité.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.28s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Autonomie <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Esprit d’équipe<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">La préférence pour l’indépendance dans le travail, ou pour la coopération collective.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Altruisme <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Pragmatisme<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">La place accordée à l’aide apportée aux autres, et aux résultats concrets.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.36s; display: grid; grid-template-columns: 660px minmax(0, 1fr); gap: 28px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 26px;\"><p style=\"margin: 0; font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--violet); white-space: nowrap;\">Recherche de nouveauté <span style=\"color: var(--violet-mid); font-weight: 400;\">↔<\u002Fspan> Goût des habitudes<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">L’envie de renouvellement, ou la préférence pour des repères et des routines.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mes Talents Professionnels — lire le rapport\" data-screen-label=\"28\" data-speaker-notes=\"Le rapport s'ouvre sur les 2 profils-types les plus proches ; pas de code comme à Ma Boussole. Vigilance : le test ne note rien, c'est un support d'échange. Deux traits qui semblent se contredire, c'est normal. Les résultats restent confidentiels sans l'accord de la personne.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Outil 4 · Mes Talents Professionnels · comment on le lit<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 36px;\">Du score au métier, en 5 étapes<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 64px; flex: 1; min-height: 0; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <div data-anim=\"up\" style=\"animation-delay: 0.12s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">1<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">14 scores sur 10<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">Comportement professionnel et motivations, chacun entre deux pôles.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">2<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Un commentaire par dimension<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">Selon l’intensité du score, avec un résumé des points forts et des points de vigilance.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.2s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">3<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">10 profils-types<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">Fédérateur, Entrepreneur, Analyste, Créateur, Organisateur, Négociateur, Serein, Engagé, Indépendant, Bienveillant. Le rapport s’ouvre sur les 2 plus proches ; pas de code.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">4<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Une soixantaine de compétences clés<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">En 9 familles, chacune repérée comme point fort, à consolider ou à développer.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.28s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\">\n          <p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">5<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n            <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Près de 300 métiers, 9 familles<\u002Fh3>\n            <p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty;\">Classés par pourcentage de proximité, avec un top 10.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div data-anim=\"up\" style=\"animation-delay: 0.3s; background: #fff; border-radius: 14px; padding: 28px 32px; box-shadow: 0 2px 6px rgba(17,17,17,0.06); display: flex; flex-direction: column; gap: 14px;\">\n          <p style=\"margin: 0 0 4px; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--slate);\">Lire les pourcentages<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: #fff; background: #4A4B80; border: 2px solid #4A4B80; border-radius: 999px; padding: 4px 0; text-align: center;\">80 % et +<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Très proche de vous »<\u002Fp>\n          <\u002Fdiv>\n          <di
