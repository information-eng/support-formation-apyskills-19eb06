v style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: #fff; background: var(--violet); border: 2px solid var(--violet); border-radius: 999px; padding: 4px 0; text-align: center;\">65 – 79 %<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Proche de vous »<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: var(--violet); background: var(--peri); border: 2px solid var(--peri); border-radius: 999px; padding: 4px 0; text-align: center;\">50 – 64 %<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Possible »<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center;\">\n            <p style=\"margin: 0; font-size: 24px; font-weight: 700; color: var(--violet); background: #fff; border: 2px solid var(--violet-mid); border-radius: 999px; padding: 4px 0; text-align: center;\">&lt; 50 %<\u002Fp>\n            <p style=\"margin: 0; font-size: 26px; color: var(--ink);\">« Éloigné de vous, pour l’instant »<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"up\" style=\"animation-delay: 0.38s; background: var(--peri); border-radius: 14px; padding: 28px 32px; display: flex; flex-direction: column; gap: 10px;\">\n          <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Point de vigilance<\u002Fp>\n          <p style=\"margin: 0; font-size: 26px; line-height: 1.45; color: var(--ink); text-wrap: pretty;\">Le test ne note rien. Les scores se lisent entre eux et selon le poste visé ; deux traits contradictoires, c’est normal. Résultats confidentiels sans l’accord de la personne.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Apprendre à lire un score sur 10\" data-screen-label=\"29\" data-speaker-notes=\"C&#x27;est probablement la compétence la plus importante ! Mes Talents Professionnels ne sert pas à enfermer une personne dans un profil ni à lui attribuer un métier. Il permet de mettre en lumière ses préférences, ses motivations et ses ressources, puis de les confronter à son expérience et à ses aspirations. Notre rôle est de l&#x27;aider à transformer cette connaissance en décisions professionnelles réfléchies et en actions concrètes.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mes Talents Professionnels · la compétence clé<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 32px;\">Apprendre à lire un score sur 10<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 56px; align-items: start;\"><div style=\"display: flex; flex-direction: column; gap: 24px;\"><div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">1<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; font-weight: 700; line-height: 1.2;\">Comprendre les deux pôles<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Chaque dimension met en regard deux tendances : savoir quel pôle correspond à chaque extrémité du score, avant de l’interpréter.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">2<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; font-weight: 700; line-height: 1.2;\">Regarder l’intensité<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Plus le score se rapproche d’un pôle, plus la préférence peut être marquée. Un score intermédiaire signale une tendance moins tranchée.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">3<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 29px; font-weight: 700; line-height: 1.2;\">Vérifier avec la personne<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Un score est une hypothèse à explorer : demander des exemples concrets, puis vérifier si la personne se reconnaît dans le commentaire.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; background: var(--peri); border-radius: 20px; padding: 32px 34px; display: flex; flex-direction: column; gap: 16px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">Exemple : Spontanéité ↔ Méthode<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">Proche de Spontanéité : une préférence pour l’adaptation et l’action sans planification excessive.<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">Proche de Méthode : une préférence pour l’organisation, la préparation et les étapes définies.<\u002Fp><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Aucun des deux n’est supérieur à l’autre — et une personne peut mobiliser les deux selon la situation.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.4s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">La bonne question : « Dans quelles situations cette préférence est-elle une ressource, et dans lesquelles peut-elle demander un ajustement ? »<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mon Mode d’Emploi — ce que c’est\" data-screen-label=\"30\" data-speaker-notes=\"Mon Mode d&#x27;Emploi est un inventaire de préférences qui aide la personne à mieux comprendre sa manière habituelle de fonctionner, de réfléchir, de prendre des décisions et de s&#x27;organiser. Il permet de mettre des mots sur ses préférences et de mieux identifier ce qui lui correspond naturellement. Comme tout inventaire de préférences, il ne s&#x27;agit pas de mesurer des compétences, ni de déterminer si une manière de fonctionner est meilleure qu&#x27;une autre. L&#x27;objectif est d&#x27;apporter des repères pour mieux se connaître et comprendre ses différences avec les autres.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Outil 5 · Mon Mode d’Emploi · 40 questions · 10 min<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 20px;\">Comprendre ses préférences de fonctionnement<\u002Fh2>\n    <p data-anim=\"up\" style=\"animation-delay: 0.12s; margin: 0 0 32px; font-size: 28px; line-height: 1.45; color: var(--ink-soft); max-width: 62ch; text-wrap: pretty;\">Un inventaire de préférences : mieux comprendre sa manière habituelle de fonctionner, de réfléchir, de prendre des décisions et de s’organiser — sans mesurer des compétences.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">E / I — Extraversion / Introversion<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment la personne mobilise son énergie et se positionne dans les interactions avec son environnement.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">S / N — Sensation / Intuition<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle recueille et traite les informations : les faits concrets, ou les possibilités et les idées.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">T / F — Pensée / Sentiment<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle aborde ses décisions : l’analyse logique, ou les valeurs et l’impact humain.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; display: flex; flex-direction: column; gap: 8px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; color: var(--violet);\">J / P — Jugement / Perception<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comment elle aborde l’organisation : la planification et la structure, ou la souplesse et l’adaptation.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.4s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Ces préférences ne sont pas des cases rigides : une personne peut utiliser les deux côtés d’une paire selon les situations, les contraintes et son expérience.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mon Mode d’Emploi — les quatre paires\" data-screen-label=\"31\" data-speaker-notes=\"Basculez entre les deux exemples : mêmes quatre lettres, lecture très différente. Une préférence n'est pas une compétence. Pour Amandine : l'écart entre les deux côtés aide à comprendre si une préférence ressort plus nettement que l'autre. Avec E = 23 et I = 9, la préférence E ressort davantage : inviter la personne à réfléchir à la façon dont cela se manifeste dans son quotidien. Lorsque les scores sont proches, rester nuancé et lui demander dans quelles circonstances elle se reconnaît dans l'un ou l'autre fonctionnement.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Mon Mode d’Emploi · lire la netteté<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 28px;\">Mon Mode d’Emploi : lire la netteté<\u002Fh2>\n    <div style=\"display: flex; gap: 18px; margin: 0 0 36px;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ setNet }}\" style=\"padding: 16px 34px; border-radius: 999px; border: 2px solid {{ netBd }}; background: {{ netBg }}; color: {{ netFg }}; font-family: var(--font-sans); font-size: 26px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">Préférences nettes<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ setEqu }}\" style=\"padding: 16px 34px; border-radius: 999px; border: 2px solid {{ equBd }}; background: {{ equBg }}; color: {{ equFg }}; font-family: var(--font-sans); font-size: 26px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">Paires serrées<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; flex: 1; min-height: 0; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 26px;\">\n        <sc-for list=\"{{ paires }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"display: grid; grid-template-columns: 270px 1fr; align-items: center; gap: 28px;\">\n            <span style=\"font-size: 26px; color: var(--ink-soft);\">{{ p.sujet }}<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 14px;\">\n              <span style=\"font-family: var(--font-display); font-size: 30px; color: var(--violet); width: 28px;\">{{ p.g }}<\u002Fspan>\n              <span style=\"flex: 1; height: 30px; border-radius: 999px; background: var(--mist); display: flex; overflow: hidden;\"><span style=\"height: 100%; width: {{ p.gw }}; background: {{ p.gc }}; transition: width 420ms cubic-bezier(0.22,1,0.36,1);\"><\u002Fspan><\u002Fspan>\n              <span style=\"font-size: 24px; color: var(--slate); width: 64px;\">{{ p.gs }}<\u002Fspan>\n              <span style=\"font-family: var(--font-display); font-size: 30px; color: var(--violet); width: 28px;\">{{ p.d }}<\u002Fspan>\n              <span style=\"flex: 1; height: 30px; border-radius: 999px; background: var(--mist); display: flex; overflow: hidden;\"><span style=\"height: 100%; width: {{ p.dw }}; background: {{ p.dc }}; transition: width 420ms cubic-bezier(0.22,1,0.36,1);\"><\u002Fspan><\u002Fspan>\n              <span style=\"font-size: 24px; color: var(--slate); width: 64px;\">{{ p.ds }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-radius: 20px; padding: 44px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; gap: 24px; align-self: stretch;\">\n        <p style=\"margin: 0; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--slate);\">Résultat<\u002Fp>\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 88px; font-weight: 700; letter-spacing: 0.06em; color: var(--violet);\">{{ pairCode }}<\u002Fp>\n        <p style=\"margin: 0; font-size: 28px; color: var(--ink-soft); line-height: 1.45;\">{{ pairLecture }}<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: 26px; color: var(--violet); font-weight: 600; line-height: 1.4;\">Un support d’échange, pas une évaluation validée — et jamais le nom d’un test propriétaire à quatre lettres.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mon Mode d’Emploi — le rôle du consultant\" data-screen-label=\"32\" data-speaker-notes=\"Les préférences qui ressortent sur les quatre dimensions forment un profil de quatre lettres : dans l&#x27;exemple, E23 / I9, S11 / N21, T13 / F19 et J10 / P22 conduisent à ENFP (dans ApySkills, chaque paire retient le côté au score le plus élevé). Ce code est une synthèse : un point de départ à l&#x27;échange, pas une étiquette définitive. Le rôle du consultant n&#x27;est pas de dire à la personne qui elle est, mais de l&#x27;aider à comprendre ce que ses préférences peuvent signifier concrètement. L&#x27;objectif final : l&#x27;aider à mieux comprendre son fonctionnement, à reconnaître ses ressources et à identifier les environnements ou les méthodes de travail qui peuvent lui convenir.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mon Mode d’Emploi · le rôle du consultant<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Aider à comprendre, pas dire qui elle est<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 40px; align-items: stretch;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--peri); border-radius: 20px; padding: 36px 34px; display: flex; flex-direction: column; gap: 18px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; color: var(--violet);\">Le profil à quatre lettres<\u002Fh3><p style=\"margin: 0; font-size: 27px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">E23 / I9 · S11 / N21 · T13 / F19 · J10 / P22 → ENFP<\u002Fp><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Une synthèse des préférences : un point de départ à l’échange, et non une étiquette définitive. La personne confronte les résultats à son vécu, donne des exemples et nuance ce qui ne lui correspond pas.<\u002Fp><p style=\"margin: 0; font-size: 25px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Scores proches : rester nuancé, et demander dans quelles circonstances elle se reconnaît dans l’un ou l’autre fonctionnement.<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.22s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 36px 34px; display: flex; flex-direction: column; gap: 18px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; color: var(--violet);\">Quatre questions à poser<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Dans quelles situations vous reconnaissez-vous dans cette préférence ? »<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Est-ce que votre façon de fonctionner change selon le contexte ou les personnes ? »<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Quels sont les avantages de cette préférence dans votre travail ? »<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">« Dans quelles situations pourriez-vous avoir besoin de vous adapter ? »<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <p data-anim=\"up\" style=\"animation-delay: 0.4s; margin: auto 0 0; padding-top: 28px; font-size: 27px; line-height: 1.45; color: var(--violet); font-weight: 600; max-width: 70ch; text-wrap: pretty;\">Point de vigilance : Mon Mode d’Emploi décrit des préférences ; il ne mesure pas à lui seul les capacités, les compétences ou la réussite professionnelle.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Mon ADN — ce que c’est\" data-screen-label=\"33\" data-speaker-notes=\"Le test Mon ADN est un outil de connaissance de soi qui s&#x27;inspire de l&#x27;ennéagramme. Il aide à comprendre les motivations, les besoins et les modes de fonctionnement d&#x27;une personne, notamment dans son environnement professionnel. Présenter les neuf profils par leur motivation principale.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Outil 6 · Mon ADN · 45 questions · 12 min<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 20px;\">Neuf profils, neuf motivations<\u002Fh2>\n    <p data-anim=\"up\" style=\"animation-delay: 0.12s; margin: 0 0 32px; font-size: 28px; line-height: 1.45; color: var(--ink-soft); max-width: 62ch; text-wrap: pretty;\">Un outil de connaissance de soi qui s’inspire de l’ennéagramme : il aide à comprendre les motivations, les besoins et les modes de fonctionnement d’une personne, notamment au travail.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">1 · Le Perfectionniste<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Faire les choses correctement<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">2 · L’Altruiste<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Aider et être utile aux autres<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.26s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">3 · Le Battant<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Réussir et atteindre ses objectifs<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">4 · Le Créatif sensible<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Exprimer sa singularité et rechercher du sens<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.38s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">5 · L’Observateur<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Comprendre et approfondir<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.44s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">6 · Le Loyal prudent<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Rechercher la sécurité et anticiper les risques<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.50s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">7 · L’Épicurien<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Explorer les possibilités et vivre de nouvelles expériences<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.56s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">8 · Le Meneur<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Agir, décider et préserver son autonomie<\u002Fp><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.62s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 18px 26px; display: flex; flex-direction: column; gap: 4px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; color: var(--violet);\">9 · Le Médiateur<\u002Fh3><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Préserver l’harmonie et rechercher l’apaisement<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mon ADN — le cercle\" data-screen-label=\"34\" data-speaker-notes=\"Cliquez un type : sa force d'abord, son défi comme une piste. Les deux voisins s'éclairent : l'aile est le plus fort des deux.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; box-sizing: border-box; overflow: hidden;\">\n    <div>\n      <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Mon ADN · le cercle<\u002Fp>\n      <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 28px; max-width: 18ch;\">Mon ADN : ce qui pousse, pas ce qu’on montre<\u002Fh2>\n      <div data-anim=\"fade\" style=\"background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; gap: 20px; min-height: 380px;\">\n        <p style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">{{ ennTitre }}<\u002Fp>\n        <p style=\"margin: 0; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet-mid);\">Force<\u002Fp>\n        <p style=\"margin: 0; font-size: 29px; color: var(--ink-soft); line-height: 1.45;\">{{ ennForce }}<\u002Fp>\n        <p style=\"margin: 0; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--violet-mid);\">Défi<\u002Fp>\n        <p style=\"margin: 0; font-size: 29px; color: var(--ink-soft); line-height: 1.45;\">{{ ennDefi }}<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: 26px; color: var(--violet); font-weight: 600;\">{{ ennAiles }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"pop\" style=\"position: relative; width: 660px; height: 660px; justify-self: center;\">\n      <div style=\"position: absolute; inset: 70px; border-radius: 50%; border: 2px solid var(--peri);\"><\u002Fdiv>\n      <p style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; font-family: var(--font-display); font-size: 40px; font-weight: 700; color: var(--violet); text-align: center; max-width: 9ch; line-height: 1.15;\">{{ ennResultat }}<\u002Fp>\n      <sc-for list=\"{{ ennNodes }}\" as=\"n\" hint-placeholder-count=\"9\">\n        <button type=\"button\" sc-camel-on-click=\"{{ n.pick }}\" style=\"position: absolute; left: {{ n.x }}; top: {{ n.y }}; transform: translate(-50%, -50%); width: 116px; height: 116px; border-radius: 50%; border: 2px solid var(--violet-mid); background: {{ n.bg }}; color: {{ n.fg }}; font-family: var(--font-display); font-size: 42px; font-weight: 700; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center;\">{{ n.n }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mon ADN — comprendre les ailes\" data-screen-label=\"35\" data-speaker-notes=\"Une aile est l&#x27;influence de l&#x27;un des deux types voisins du profil principal. Elle vient nuancer le fonctionnement de la personne, sans remplacer son type principal. Le « w » signifie wing, c&#x27;est-à-dire « aile » en anglais. Dans ApySkills, le rapport l&#x27;écrit en toutes lettres : « Type 7 aile 6 ». Dérouler ensuite les cinq étapes de lecture.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mon ADN · comprendre les ailes<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">L’aile nuance, elle ne remplace pas<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 44px; align-items: start;\"><div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--peri); border-radius: 20px; padding: 36px 34px; display: flex; flex-direction: column; gap: 18px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; color: var(--violet);\">Une aile, c’est quoi ?<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">L’influence de l’un des deux types voisins du profil principal. Elle nuance le fonctionnement de la personne, sans remplacer son type principal.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong style=\"color: var(--violet);\">7w6<\u002Fstrong> · recherche de nouveauté, avec une attention aux repères et à la sécurité.<\u002Fp><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\"><strong style=\"color: var(--violet);\">7w8<\u002Fstrong> · recherche de nouveauté, avec davantage d’affirmation et d’action.<\u002Fp><p style=\"margin: 0; font-size: 23px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">Le « w » signifie wing : « aile » en anglais. Dans ApySkills, on lit « Type 7 aile 6 ».<\u002Fp><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 18px;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 32px; color: var(--violet);\">Comment lire les résultats ?<\u002Fh3><div style=\"display: flex; flex-direction: column; gap: 14px;\"><div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">1<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Repérer<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">le profil principal qui ressort dans le rapport.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">2<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Identifier<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">l’aile éventuelle et comprendre la nuance qu’elle apporte.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">3<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Explorer<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">les motivations et les besoins associés.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.28s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">4<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Faire le lien<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">avec les comportements professionnels.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.32s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">5<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2;\">Vérifier<\u002Fh3><p style=\"margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">avec le bénéficiaire ce qui lui correspond réellement.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Mise en pratique — Mon ADN\" data-screen-label=\"36\" data-speaker-notes=\"Durée : 5 minutes. Pistes de réponse, avec les mots du rapport : le 6, le Loyal prudent, recherche la sécurité et anticipe les risques ; l&#x27;aile 5 apporte de l&#x27;analyse et de la réserve — une prudence plus intellectuelle, qui comprend les systèmes et se protège par le savoir, plus indépendante, plus discrète. Question ouverte possible : « Est-ce que vous vous reconnaissez dans ce besoin de comprendre avant de vous engager ? »\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet); max-width: none;\">Mise en pratique · Mon ADN · 5 min<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 12px;\">Une situation<\u002Fh2>\n    <blockquote data-anim=\"up\" style=\"animation-delay: 0.1s; margin: 8px 0 30px; font-family: var(--font-display); font-size: 40px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; max-width: 46ch; color: var(--ink);\">« Un bénéficiaire présente un profil 6 avec une aile 5. »<\u002Fblockquote>\n    <p style=\"margin: 0; font-size: 28px; line-height: 1.4; color: var(--ink); text-wrap: pretty; max-width: none;\">Le consultant doit :<\u002Fp>\n    <div style=\"height: 18px;\"><\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 18px;\"><div data-anim=\"up\" style=\"animation-delay: 0.16s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">1<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Expliquer<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">le profil en deux phrases.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.20s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">2<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Présenter<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">la nuance apportée par l’aile.<\u002Fp><\u002Fdiv><\u002Fdiv><div data-anim=\"up\" style=\"animation-delay: 0.24s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px; align-items: start;\"><p style=\"margin: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--peri); color: var(--violet); font-family: var(--font-display); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">3<\u002Fp><div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\"><h3 style=\"margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2;\">Poser une question ouverte<\u002Fh3><p style=\"margin: 0; font-size: 26px; line-height: 1.4; color: var(--ink-soft); text-wrap: pretty; max-width: none;\">pour vérifier si le bénéficiaire se reconnaît.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Versions collège &amp; lycée\" data-screen-label=\"37\" data-speaker-notes=\"Règle : de la 4e à la Terminale, toujours la version collège &amp; lycée. Un jeune majeur en études supérieures passe la version adultes.\" style=\"background: var(--peri); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">De la 4e à la Terminale<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Les versions collège &amp; lycée<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 40px;\">\n      <div data-anim=\"up\" style=\"animation-delay: 0.14s; background: #fff; border-radius: 20px; padding: 44px; display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 36px; color: var(--violet);\">Ce qui ne change pas<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.45;\">Le même instrument, le même barème, les mêmes lettres, la même façon de lire le résultat.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.22s; background: #fff; border-radius: 20px; padding: 44px; display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 36px; color: var(--violet);\">Ce qui change<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.45;\">Le tutoiement, des situations de classe, de devoirs, d’amis et de loisirs, et des interprétations qui parlent de filières plutôt que de métiers.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fade\" style=\"animation-delay: 0.3s; margin: 40px 0 0; font-size: var(--t-body); color: var(--violet); font-weight: 600; background: #fff; border-radius: 14px; padding: 32px 40px; max-width: none;\">On reconnaît la version au suffixe dans son titre, dans la liste de la fenêtre « Confier ».<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"§ 3 — Dans l’application\" data-screen-label=\"38\" data-speaker-notes=\"Section : atelier pratique sur le dossier d'essai. Démonstration guidée, puis chacune refait le circuit en accéléré.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Module 3 · 25 minutes<\u002Fp>\n    <p data-anim=\"fade\" style=\"margin: 16px 0 0; font-family: var(--font-display); font-size: 200px; line-height: 0.9; color: var(--peach); opacity: 0.4; font-weight: 700;\">3<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.12s; font-family: var(--font-display); font-size: 88px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em; margin: 48px 0 0; color: var(--cream); max-width: 18ch;\">Dans l’application<\u002Fh2>\n  <\u002Fsection>\n\n  <section data-label=\"Le circuit d’un test\" data-screen-label=\"39\" data-speaker-notes=\"Suivre les six étapes une par une, puis chacune refait le circuit en accéléré sur son dossier d'essai — 25 minutes en tout.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">De la prescription à la preuve<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 40px;\">Le circuit d’un test, en six gestes<\u002Fh2>\n    <div style=\"display: flex; gap: 14px; margin: 0 0 44px;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ pickEtp0 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; text-align: left; padding: 24px 22px; border-radius: 14px; border: none; border-top: 6px solid {{ etpBd.n0 }}; background: {{ etpBg.n0 }}; color: {{ etpFg.n0 }}; font-family: var(--font-sans); font-size: 25px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.65;\">1<\u002Fspan>\n        <span>Confier<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickEtp1 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; text-align: left; padding: 24px 22px; border-radius: 14px; border: none; border-top: 6px solid {{ etpBd.n1 }}; background: {{ etpBg.n1 }}; color: {{ etpFg.n1 }}; font-family: var(--font-sans); font-size: 25px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.65;\">2<\u002Fspan>\n        <span>Choisir le mode<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickEtp2 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; text-align: left; padding: 24px 22px; border-radius: 14px; border: none; border-top: 6px solid {{ etpBd.n2 }}; background: {{ etpBg.n2 }}; color: {{ etpFg.n2 }}; font-family: var(--font-sans); font-size: 25px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.65;\">3<\u002Fspan>\n        <span>Suivre<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickEtp3 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; text-align: left; padding: 24px 22px; border-radius: 14px; border: none; border-top: 6px solid {{ etpBd.n3 }}; background: {{ etpBg.n3 }}; color: {{ etpFg.n3 }}; font-family: var(--font-sans); font-size: 25px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.65;\">4<\u002Fspan>\n        <span>Lire<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickEtp4 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; text-align: left; padding: 24px 22px; border-radius: 14px; border: none; border-top: 6px solid {{ etpBd.n4 }}; background: {{ etpBg.n4 }}; color: {{ etpFg.n4 }}; font-family: var(--font-sans); font-size: 25px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.65;\">5<\u002Fspan>\n        <span>Régler la visibilité<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickEtp5 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; text-align: left; padding: 24px 22px; border-radius: 14px; border: none; border-top: 6px solid {{ etpBd.n5 }}; background: {{ etpBg.n5 }}; color: {{ etpFg.n5 }}; font-family: var(--font-sans); font-size: 25px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 30px; opacity: 0.65;\">6<\u002Fspan>\n        <span>Retrouver la trace<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div data-anim=\"fade\" style=\"background: #fff; border-radius: 20px; padding: 48px 56px; box-shadow: 0 8px 24px rgba(17,17,17,0.08); display: flex; flex-direction: column; flex: 1; min-height: 0;\">\n      <div style=\"display: {{ etpShow.n0 }}; flex-direction: column; gap: 26px; flex: 1;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">Confier<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5; max-width: 60ch;\">Onglet Tâches du dossier — ou depuis une séance : Confier une tâche → Questionnaires et tests → l’instrument, dans la bonne version.<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Repérez le suffixe adultes / collège &amp; lycée dans le titre.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ etpShow.n1 }}; flex-direction: column; gap: 26px; flex: 1;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">Choisir le mode<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5; max-width: 60ch;\">« En séance » veut dire maintenant, avec vous. « À la maison » rend le test visible dans l’espace du bénéficiaire, à faire avant une date.<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Ajoutez une échéance et une consigne d’une phrase.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ etpShow.n2 }}; flex-direction: column; gap: 26px; flex: 1;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">Suivre<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5; max-width: 60ch;\">La ligne apparaît dans Tâches avec son statut : à faire, en cours, terminé. Envoyer expédie par e-mail, Lien donne le lien direct, Annuler retire la tâche.<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">La veille de l’échéance, l’application relance elle-même le bénéficiaire.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ etpShow.n3 }}; flex-direction: column; gap: 26px; flex: 1;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">Lire<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5; max-width: 60ch;\">Le bouton Résultats ouvre les scores par dimension, le code ou le profil, et l’interprétation de chaque dimension.<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">C’est cet écran qu’on prépare avant la restitution.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ etpShow.n4 }}; flex-direction: column; gap: 26px; flex: 1;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">Régler la visibilité<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5; max-width: 60ch;\">Par défaut, le bénéficiaire voit ses résultats. Le cabinet peut les masquer, test par test, dans Tests &amp; Questionnaires.<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">À réserver aux cas où l’on veut restituer de vive voix.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: {{ etpShow.n5 }}; flex-direction: column; gap: 26px; flex: 1;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 44px; color: var(--violet);\">Retrouver la trace<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-body); color: var(--ink-soft); line-height: 1.5; max-width: 60ch;\">Journal Qualiopi du dossier : la ligne « Test … terminé », datée. Dossier de preuves : le PDF des résultats.<\u002Fp>\n        <p style=\"margin: auto 0 0; font-size: var(--t-small); color: var(--violet); font-weight: 600;\">Pour un auditeur, la passation est prouvée sans rien ajouter.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Qui voit quoi, et la trace\" data-screen-label=\"40\" data-speaker-notes=\"Par défaut le bénéficiaire voit ses résultats ; le masquage est à réserver aux restitutions de vive voix. Rien ne se fait à côté de l'application.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Visibilité<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 var(--gap-title);\">Qui voit quoi<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px;\">\n      <div data-anim=\"up\" style=\"animation-delay: 0.14s; background: var(--peri); border-radius: 20px; padding: 40px 36px; display: flex; flex-direction: column; gap: 18px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Le bénéficiaire<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">Par défaut, il voit ses résultats dans son espace. Dans un bilan, il est le seul destinataire des résultats détaillés.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"up\" style=\"animation-delay: 0.22s; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; display: flex; flex-direction: column; gap: 18px;\">\n        <h3 style=\"margin: 0; font-family: var(--font-display); font-size: 34px; color: var(--violet);\">Le cabinet<\u002Fh3>\n        <p style=\"margin: 0; font-size: var(--t-small); color: var(--ink-soft);\">Peut masquer les résultats test par test, dans « Tests &amp; Questionnaires » — à réserver aux cas où l’on veut restituer de vive voix.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fade\" style=\"animation-delay: 0.38s; margin: auto 0 0; font-family: var(--font-display); font-size: 44px; color: var(--violet); max-width: 30ch;\">Rien ne se fait à côté de l’application : ni tableur, ni e-mail.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"§ 4 — Restituer\" data-screen-label=\"41\" data-speaker-notes=\"Section : le cœur du métier. Jeu de rôle : une consultante présente son résultat Mes Talents Professionnels, les autres l'interrogent.\" style=\"background: var(--violet); color: var(--cream); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--peri);\">Module 4 · 35 minutes<\u002Fp>\n    <p data-anim=\"fade\" style=\"margin: 16px 0 0; font-family: var(--font-display); font-size: 200px; line-height: 0.9; color: var(--peach); opacity: 0.4; font-weight: 700;\">4<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.12s; font-family: var(--font-display); font-size: 88px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em; margin: 48px 0 0; color: var(--cream); max-width: 18ch;\">Restituer<\u002Fh2>\n  <\u002Fsection>\n\n  <section data-label=\"La trame en cinq temps\" data-screen-label=\"42\" data-speaker-notes=\"Dix minutes en tout. Cliquez chaque temps pour la formulation exacte à employer.\" style=\"background: var(--cream); color: var(--ink); font-family: var(--font-sans); padding: var(--pad-top) var(--pad-x) var(--pad-bottom); display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;\">\n    <p data-anim=\"up\" style=\"margin: 0; font-size: var(--t-eyebrow); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--violet);\">Dix minutes, cinq temps<\u002Fp>\n    <h2 data-anim=\"up\" style=\"animation-delay: 0.08s; font-family: var(--font-display); font-size: var(--t-title); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 24px 0 40px;\">La trame de restitution<\u002Fh2>\n    <div style=\"display: flex; gap: 16px; margin: 0 0 44px;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ pickTps0 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; text-align: left; padding: 30px 28px; border-radius: 20px; border: 2px solid {{ tpsBd.n0 }}; background: {{ tpsBg.n0 }}; color: {{ tpsFg.n0 }}; font-family: var(--font-sans); font-size: 27px; font-weight: 600; cursor: pointer; transition: all 220ms cubic-bezier(0.22,1,0.36,1);\">\n        <span style=\"font-family: var(--font-display); font-size: 44px; opacity: 0.6;\">1<\u002Fspan>\n        <span>Rappeler le cadre<\u002Fspan>\n        <span style=\"font-family: var(--font-sans); font-size: 24px; font-weight: 500; opacity: 0.8;\">1 min<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ pickTps1 }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; text-align: left; padding: 30px 28px; border-radius: 20px; border: 2px solid {{ tpsBd.n1 }}; background: {{ tpsBg.n1 }}; color: {{ tpsFg.n1 }}; font-family: var(--font-sans); font-size: 27px; font-
